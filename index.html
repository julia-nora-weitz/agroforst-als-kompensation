<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agroforst Überschlagsrechner</title>
<style>
/* Layout: Schrittleiste links, eine Frage-Spalte, Hinweise direkt unter der Frage; stapelt unter 780px.
   Tokens: warmes Papier, Waldtinte, ein frischer Akzent fuer alles Bedienbare, 2 Signalstufen (Hinweis / Achtung). */
:root{
  --paper:#FAF9F6; --surface:#FFFFFF; --tint:#F2F6F3; --sunk:#EFF1EE;
  --ink:#19211C; --ink-2:#47544C; --ink-3:#78847C;
  --line:#DDE3DE; --line-2:#ECEFEC;
  --accent:#1F7A52; --accent-2:#E8F4ED; --accent-ink:#FFFFFF;
  --note:#8A5E0B; --note-bg:#FCF4E3; --note-line:#E0B861;
  --warn:#9E3B2C; --warn-bg:#FBEEEB; --warn-line:#D9907F;
  --role-a:#2E6A4E; --role-b:#1F6085; --role-c:#A24A33; --role-d:#8A6B16; --role-e:#5F4B8B;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --r:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121714; --surface:#1A201C; --tint:#212924; --sunk:#232B26;
    --ink:#E9EEEA; --ink-2:#B5C0B9; --ink-3:#8B968E;
    --line:#2D352F; --line-2:#262D28;
    --accent:#58BC8B; --accent-2:#1C2E25; --accent-ink:#0E1512;
    --note:#E0B262; --note-bg:#2B2416; --note-line:#6B5520;
    --warn:#E8907F; --warn-bg:#2C1C19; --warn-line:#6E3A30;
    --role-a:#6FBF92; --role-b:#6AADD6; --role-c:#E0907A; --role-d:#D3B358; --role-e:#A795D8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121714; --surface:#1A201C; --tint:#212924; --sunk:#232B26;
  --ink:#E9EEEA; --ink-2:#B5C0B9; --ink-3:#8B968E;
  --line:#2D352F; --line-2:#262D28;
  --accent:#58BC8B; --accent-2:#1C2E25; --accent-ink:#0E1512;
  --note:#E0B262; --note-bg:#2B2416; --note-line:#6B5520;
  --warn:#E8907F; --warn-bg:#2C1C19; --warn-line:#6E3A30;
  --role-a:#6FBF92; --role-b:#6AADD6; --role-c:#E0907A; --role-d:#D3B358; --role-e:#A795D8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px;padding-block:22px 44px}

header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:12px}
.brandline{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--serif);font-size:26px;line-height:1.18;margin:5px 0 0;font-weight:400;text-wrap:balance}
.standnote{font-size:11px;color:var(--ink-3);text-align:right;min-width:92px;line-height:1.45}
.lede{font-size:13px;color:var(--ink-2);margin-top:8px;max-width:72ch}

.scope{font-size:12.5px;color:var(--ink-2);margin-top:10px;max-width:84ch;padding:8px 12px;border-left:3px solid var(--accent);
  background:var(--accent-2);border-radius:0 5px 5px 0;line-height:1.45}
.scope b{color:var(--ink);font-weight:650}
.ph{background:var(--note-bg);color:var(--note);border:1px dashed var(--note-line);border-radius:3px;padding:0 4px;font-style:normal}
.jump{font:inherit;font-size:12px;font-weight:650;color:var(--accent);background:none;border:0;padding:0;margin-left:6px;
  cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:4px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:13px;color:var(--ink-2);cursor:pointer;background:var(--surface)}
.seg label+label{border-left:1px solid var(--line)}
.seg input{accent-color:var(--accent);margin:0}
.seg label:has(input:checked){background:var(--accent-2);color:var(--ink);font-weight:650}
.rolle{margin-top:10px}
.divider{margin:24px 0 0;border-top:1px solid var(--line)}
.bar{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:16px 0 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}

.shell{display:grid;grid-template-columns:180px minmax(0,1fr);gap:32px;margin-top:22px;align-items:start}
@media (max-width:780px){.shell{grid-template-columns:minmax(0,1fr);gap:14px}}
.rail{display:flex;flex-direction:column;gap:1px;position:sticky;top:10px}
@media (max-width:780px){.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}}
.railitem{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:5px;background:none;border:0;font:inherit;
  font-size:13px;color:var(--ink-3);text-align:left;cursor:pointer;width:100%;white-space:nowrap}
.railitem:hover{background:var(--tint);color:var(--ink-2)}
.railitem .b{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;
  font-weight:700;border:1px solid var(--line);color:var(--ink-3);background:var(--surface)}
.railitem[aria-current="true"]{color:var(--ink);font-weight:650}
.railitem[aria-current="true"] .b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.railitem[data-seen="1"] .b{border-color:var(--accent);color:var(--accent)}
.railitem[data-seen="1"][aria-current="true"] .b{color:var(--accent-ink)}
.railitem .dot{width:6px;height:6px;border-radius:50%;background:var(--note);margin-left:auto;flex:none}
@media (max-width:780px){.railitem .t{display:none}.railitem{width:auto;padding:6px}.railitem .dot{display:none}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;
  box-shadow:0 1px 2px rgba(0,0,0,.03)}
@media (max-width:440px){.panel{padding:18px 15px}}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h2{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.25;margin:8px 0 0;text-wrap:balance}
.intro{font-size:13.5px;color:var(--ink-2);margin:9px 0 0;max-width:66ch}

fieldset{border:0;padding:0;margin:22px 0 0}
legend{font-size:14.5px;font-weight:650;color:var(--ink);padding:0;margin-bottom:8px;line-height:1.35}
.hint{font-size:12px;color:var(--ink-3);margin:-3px 0 9px;max-width:66ch}
.hint a{color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:5px;
  cursor:pointer;background:var(--surface);font-size:13.5px;color:var(--ink-2);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt input{margin:2px 0 0;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-2);color:var(--ink)}
.opt .sub{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.opt:focus-within{outline:2px solid var(--accent);outline-offset:1px}

.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:5px;font-size:13px;line-height:1.45;
  margin:8px 0 0;border-left:3px solid}
.flag .tag{font-weight:700;flex:none}
.flag.note{background:var(--note-bg);border-color:var(--note-line);color:var(--ink-2)}
.flag.note .tag{color:var(--note)}
.flag.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--ink-2)}
.flag.warn .tag{color:var(--warn)}
.flag ul{margin:4px 0 0;padding-left:17px}
.flag li{margin-bottom:3px}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px;margin-top:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:650;min-width:0}
label.f .u{font-weight:400;color:var(--ink-3)}
input[type=number],input[type=text],select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);
  border-radius:5px;background:var(--surface);color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}

.section-head{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;
  margin:24px 0 2px;padding-top:16px;border-top:1px solid var(--line)}

.rtable{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px;font-variant-numeric:tabular-nums}
.rtable th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;
  padding:0 8px 6px 0;border-bottom:1px solid var(--line)}
.rtable td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.rtable td.n{text-align:right;color:var(--ink);font-weight:650;white-space:nowrap}
.rtable tr.sum td{border-top:1px solid var(--ink);border-bottom:0;color:var(--ink);font-weight:700;padding-top:9px}
.rtable caption{caption-side:top;text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;padding-bottom:4px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:5px 11px;border-radius:99px;border:1px solid}
.chip.ok{color:var(--accent);border-color:var(--accent);background:var(--accent-2)}
.chip.note{color:var(--note);border-color:var(--note-line);background:var(--note-bg)}
.chip.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}

.cut{margin-top:12px;background:var(--tint);border:1px solid var(--line);border-radius:5px;padding:12px 13px}
.cut svg{display:block;width:100%;height:auto;max-width:100%}

/* Ablaufgrafik */
.flowwrap{margin-top:14px}
.flowhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin:14px 0 8px}
.flowhead .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.flowhead .v{font-size:13px;font-weight:650;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:860px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.cards{grid-template-columns:minmax(0,1fr);gap:14px}}
.card{border:1px solid var(--line);border-radius:5px;padding:11px 12px;background:var(--surface);position:relative;min-width:0}
.card .no{position:absolute;top:8px;right:11px;font-size:17px;font-weight:700;color:var(--line)}
.card{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:0;align-content:start;justify-items:start}
@media (max-width:460px){.card{grid-row:auto;grid-template-rows:none}}
.card>.who{align-self:start}
.card h4{font-size:13.5px;margin:0 0 5px;font-weight:650;line-height:1.25}
.card .who{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;padding:3px 8px;border-radius:99px;
  line-height:1.3;margin:0 24px 8px 0}
.card .txt{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.card.here{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.here::after{content:attr(data-here);position:absolute;bottom:-9px;left:11px;font-size:9.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:99px}
.w-a{background:var(--role-a)} .w-b{background:var(--role-b)} .w-c{background:var(--role-c)}
.w-d{background:var(--role-d)} .w-e{background:var(--role-e)}
.flownote{font-size:11.5px;color:var(--ink-3);margin-top:12px;font-style:italic}
.erloes{display:flex;gap:11px;align-items:flex-start;margin-top:12px;padding:11px 13px;border-radius:5px;
  border:1px dashed var(--line);background:var(--tint);font-size:12.5px;color:var(--ink-2)}
.erloes b{color:var(--ink);flex-shrink:0;white-space:nowrap}

ul.plain{list-style:none;margin:10px 0 0;padding:0}
ul.plain li{display:grid;grid-template-columns:auto 1fr;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-2);
  font-size:13px;color:var(--ink-2)}
ul.plain li .mark{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px}
ul.plain li b{color:var(--ink);font-weight:650}

.nav{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
button.btn{font:inherit;font-size:14px;font-weight:650;padding:10px 20px;border-radius:5px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);transition:filter .12s}
button.btn:hover{filter:brightness(1.08)}
button.btn.ghost{background:none;color:var(--ink-2);border-color:var(--line)}
button.btn.ghost:hover{border-color:var(--ink-3);color:var(--ink);filter:none}
button.btn.small{font-size:12.5px;padding:7px 13px}
button.btn:focus-visible,.railitem:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.counter{font-size:12px;color:var(--ink-3)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px}
@media (max-width:440px){.sheet{padding:17px 15px}}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:22px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:154px minmax(0,1fr);gap:5px 14px;font-size:13.5px;margin-top:9px}
@media (max-width:520px){.kv{grid-template-columns:minmax(0,1fr)}.kv dt{margin-top:6px}}
.kv dt{color:var(--ink-3);font-size:12px;padding-top:2px}
.kv dd{margin:0;color:var(--ink-2)}
.sheetfoot{margin-top:20px;padding-top:11px;border-top:1px solid var(--ink);font-size:11px;color:var(--ink-3);line-height:1.55}
.mailbox{margin-top:22px;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;background:var(--surface)}
.mailbox h3{font-family:var(--serif);font-weight:400;font-size:17px;margin:0 0 4px}
.mailtext{margin-top:11px;white-space:pre-wrap;font-size:12.5px;line-height:1.55;color:var(--ink-2);
  background:var(--tint);border:1px solid var(--line);border-radius:5px;padding:13px 14px;max-height:300px;overflow:auto}
footer.pagefoot{margin-top:24px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.55}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
.panel,.sheet{animation:in .22s ease}
@keyframes in{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}

.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.sheetmeta{font-size:11px;color:var(--ink-3);text-align:right;line-height:1.5;white-space:nowrap}
@media (max-width:520px){.sheethead{flex-direction:column;gap:8px}.sheetmeta{text-align:left;white-space:normal}}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
@media (max-width:620px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{border:1px solid var(--line);border-radius:5px;padding:11px 13px;background:var(--tint);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.kpi .v{font-family:var(--serif);font-size:24px;line-height:1.2;color:var(--ink)}
.kpi .s{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.tblwrap{overflow-x:auto}
.rtable th.r,.rtable td.r{text-align:right;white-space:nowrap}
.savebox{margin:0 0 14px}
.savetext{min-width:0}
.sheetfoot p{margin:0 0 6px}
.sheetfoot a,footer.pagefoot a{color:var(--accent)}
footer.pagefoot p{margin:0 0 6px}

@page{size:A4;margin:14mm 16mm}
@media print{
  html,body{background:#fff !important;color:#000}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print{display:none !important}
  .wrap{max-width:none;padding:0}
  .shell{display:block;margin:0}
  .sheet{border:0;padding:0;box-shadow:none;animation:none;background:#fff}
  .sheet h3{break-after:avoid}
  .kv>*,ul.plain li,.rtable tr,.kpi,.flag{break-inside:avoid}
  .kpi{background:#fff}
  .sheetfoot a{color:#1F7A52}
}

/* Update Oktober 2026: Umschalter, Handy-Layout, Maßstab-Zeile */
.top-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.langsw{display:inline-flex;border:1px solid var(--accent);border-radius:99px;overflow:hidden;background:var(--surface)}
.langsw button{font:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;padding:6px 14px;border:0;background:none;color:var(--accent);cursor:pointer;min-width:44px}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.langsw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top>div:first-child{min-width:0}
h1,h2,legend,.opt span,.flag .ftxt,.kv dd,.kv dt,.hint,.intro,ul.plain li span,.kpi,.card,.mailtext,.sheet,.panel,label.f{overflow-wrap:anywhere}
.flag .ftxt{min-width:0}
.flag .tag{max-width:40%}
.kv dt.hl,.kv dd.hl{background:var(--accent-2);color:var(--ink)}
.kv dt.hl{font-weight:700;color:var(--accent);padding:4px 8px;border-radius:4px 0 0 4px}
.kv dd.hl{padding:4px 8px;border-radius:0 4px 4px 0;font-weight:600}
@media (max-width:520px){.kv dt.hl{border-radius:4px 4px 0 0;padding-bottom:0}.kv dd.hl{border-radius:0 0 4px 4px;padding-top:2px}}
.rtable caption{display:table-caption}
.mailtext{overflow-wrap:anywhere}
@media (max-width:560px){
  .wrap:not(.compact) .top-r .standnote{display:none}
  .wrap.compact .standnote{font-size:10.5px;max-width:150px}
  .tblwrap{overflow-x:visible}
  table.rtable.stack,table.rtable.stack tbody,table.rtable.stack tr,table.rtable.stack td{display:block;width:100%}
  table.rtable.stack caption{display:block;width:100%;white-space:normal}
  table.rtable.stack thead{position:absolute;left:-9999px}
  table.rtable.stack tr{border-bottom:1px solid var(--line);padding:6px 0}
  table.rtable.stack td{border:0;padding:2px 0;text-align:left !important;white-space:normal}
  table.rtable.stack td.r::before,table.rtable.stack td[data-l]::before{content:attr(data-l)": ";color:var(--ink-3);font-size:11px}
  table.rtable.stack td:first-child{font-weight:700;color:var(--ink)}
  table.rtable.stack td:first-child::before{content:""}
  table.rtable.stack td.e{display:none}
  .rtable td.n{white-space:normal}
  .nav .btn{flex:1 1 100%}
  .kpi .v{font-size:22px}
}

/* Kopfbereich ab Laptopbreite: grosse Titelzeile, Erlaeuterung und Rechengrundlage nebeneinander */
.verweise{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:flex-start;margin-top:12px}
.verweise details{min-width:0}
.verweise summary,.verweise .vlink{font-size:13px;font-weight:650;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;list-style:none;background:none;border:0;padding:2px 0;font-family:inherit}
.verweise summary::-webkit-details-marker{display:none}
.verweise summary::before{content:"+ ";font-weight:700}
.verweise details[open] summary::before{content:"\2212  "}
.verweise .vbody{font-size:13px;color:var(--ink-2);line-height:1.55;margin-top:6px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-2);border-radius:0 5px 5px 0;max-width:62ch}
.verweise .vbody b{color:var(--ink);font-weight:650}
.wrap.compact .intro-grid{display:none}
.wrap.compact header.top>div:first-child{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 14px}
.wrap.compact h1{font-size:17px;margin:0}
.wrap.compact h1 .tsep{display:inline}
.wrap.compact h1 .tsub{display:inline;font-size:inherit;color:inherit;margin:0}
.wrap.compact header.top{padding-bottom:8px;margin-bottom:8px}
.wrap.compact .bar{margin-top:6px}
.wrap:not(.compact) .standnote{display:none}
.standnote a{color:var(--ink-3)}
.costbox{margin-top:14px;border:1px solid var(--line);border-radius:5px;padding:12px 14px;background:var(--surface);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.costbox b{display:block;color:var(--ink);font-size:12.5px;margin-bottom:4px}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:620px){.fields.two{grid-template-columns:minmax(0,1fr)}}
label.f.soft{color:var(--ink-3);font-weight:500}
label.f.soft .u{color:var(--ink-3)}
.missmsg{display:none;color:var(--warn);font-size:12px;font-weight:700;margin:0 0 6px}
.miss .missmsg{display:block}
fieldset.miss{outline:2px solid var(--warn);outline-offset:6px;border-radius:5px}
label.f.miss input{border-color:var(--warn);outline:2px solid var(--warn-line)}
.sheet{min-width:0}
.sheet,.sheet *{overflow-wrap:anywhere}
.sheetmeta{white-space:normal}
@media (max-width:900px){.sheetmeta{text-align:left}.sheethead{flex-direction:column;gap:8px}}
.kv{grid-template-columns:minmax(0,154px) minmax(0,1fr)}
@media (min-width:900px){
  .wrap{padding-top:36px}
  header.top{align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .brandline{font-size:12px;letter-spacing:.16em}
  h1{font-size:40px;line-height:1.1;margin-top:10px;letter-spacing:-.01em}
  h1 .tsep{display:none}
  h1 .tsub{display:block;font-size:22px;line-height:1.3;color:var(--ink-2);margin-top:8px;letter-spacing:0}
  .top-r{align-items:flex-end;gap:12px}
  .standnote{font-size:12px}
  .intro-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:stretch;margin-top:0}
  .intro-grid .lede{margin-top:0;max-width:none;font-size:14px;line-height:1.6;color:var(--ink-2);align-self:center}
  .intro-grid .scope{margin-top:0;max-width:none;font-size:13px;padding:12px 16px}
  .bar{margin-top:24px}
  .intro-grid{grid-template-columns:minmax(0,1fr);gap:4px}
  .verweise{margin-top:6px}
  .verweise details{position:relative}
  .verweise details[open]>.vbody{position:absolute;left:0;top:100%;z-index:20;width:min(560px,80vw);box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .wrap.compact header.top{padding-bottom:10px;margin-bottom:10px}
  .wrap.compact h1{font-size:20px;margin:0}
  .wrap.compact .brandline{font-size:11px}
  .wrap.compact .top-r{flex-direction:row;align-items:center;gap:14px}
}

  }
  function runsHTML(runs){
    return runs.map(function(r){
      var t = esc(r.t);

  function fussHTML(){ return fuss().map(function(p){ return "<p>" + runsHTML(p) + "</p>"; }).join(""); }
  var HINWEIS_KOPF = function(){ return T("Unverbindlicher Überschlag auf Grundlage einer Masterarbeit","Non-binding rough estimate based on a master's thesis"); };

  var ABLAUF = [
    {n:1, t:["Vorhaben entwickeln","Develop the project"], w:["Kommune und Bewirtschafter","Municipality and farmer"], c:"w-a", x:["Ziel, Fläche und Agroforsttyp klären","Clarify goal, site and type of agroforestry system"], here:true},
    {n:2, t:["Vorabstimmung mit UNB","Pre-consultation with the UNB"], w:["Kommune und Bewirtschafter","Municipality and farmer"], c:"w-a", x:["Ortstermin vor der Planung, noch unverbindlich","Site visit before planning, still non-binding"], here:true},
    {n:3, t:["Pflanzplan und Bewertung","Planting plan and assessment"], w:["Fachbüro","Specialist consultancy"], c:"w-b", x:["unter anderem Ausgangszustand kartieren","among other things, map the initial condition"]},
    {n:4, t:["Rechtlich sichern","Secure legally"], w:["Kommune oder Bewirtschafter","Municipality or farmer"], c:"w-a", x:["Dauerhaft wirkt nur eine Dienstbarkeit im Grundbuch","Only an easement entered in the land register is permanent"]},
    {n:5, t:["Anerkennung und Eintrag","Recognition and registration"], w:["Untere Naturschutzbehörde","Lower nature conservation authority"], c:"w-c", x:["Ökokonto im Vorgriff oder Auflage im Zulassungsbescheid","Eco-account in advance, or condition in the permit decision"]},
    {n:6, t:["Pflanzung und Pflege","Planting and care"], w:["Spezialisierter Dienstleister","Specialist service provider"], c:"w-d", x:["Jahr 0 bis 2, der arbeitsintensivste Abschnitt","Years 0 to 2, the most labour-intensive phase"]},
    {n:7, t:["Entwicklungsnachweis","Proof of development"], w:["Maßnahmenträger an die Behörde","Responsible body to the authority"], c:"w-d", x:["nach 3 und 5 Jahren, Ausfälle nachpflanzen","after 3 and 5 years, replant losses"]},
    {n:8, t:["Fortbestand sichern","Maintain continuity"], w:["Bewirtschafter und UNB","Farmer and UNB"], c:"w-d", x:["Die Maßnahme besteht, solange der Eingriff wirkt","The measure remains for as long as the intervention has effect"]}
  ];

  /* Teil D: [Titel, Text], jeweils [de, en] */
  var FESTE_PUNKTE = [
    [["Bewertungsansatz.","Assessment approach."],
     ["Die Biotopwertliste führt keinen Biotoptyp für Agroforst. Der Überschlag nutzt den Bewertungsvorschlag der Masterarbeit, eine Analogie zu Hecken und Baumreihen. Ob die UNB ihn für Ihre Maßnahme mitträgt, entscheidet sie im Einzelfall.","The biotope value list contains no biotope type for agroforestry. The rough estimate uses the assessment proposal of the master's thesis, an analogy with hedges and tree rows. Whether the UNB supports it for your measure is for it to decide in the individual case."]],
    [["Ausgangszustand.","Initial condition."],
     ["Den Ausgangswert legt die UNB auf Grundlage einer Kartierung fest. Er bestimmt die gesamte Bilanz; der Wert im Überschlag ist eine Annahme.","The UNB sets the initial value on the basis of a mapping. It determines the entire balance; the value in the rough estimate is an assumption."]],
    [["Zielwert und Time-Lag.","Target value and time lag."],
     ["Welcher Zielwert und welcher Time-Lag-Faktor anerkannt werden, klärt sich in der Abstimmung und mit dem Pflanzplan.","Which target value and which time-lag factor are recognised is settled in the consultation and with the planting plan."]],
    [["Saum.","Margin strip."],
     ["Anrechenbare Breite und Anforderungen an Anlage und Pflege legt die UNB fest; vorgeschlagen sind 2 bis 5 m je Seite.","The UNB sets the creditable width and the requirements for establishment and care; 2 to 5 m per side are proposed."]],
    [["Bindungsdauer.","Binding period."],
     ["Vorgeschlagen sind 20 Jahre für die Maßnahme und 50 Jahre für Überhälter. Wie die Dauerhaftigkeit bei regelmäßiger Holzernte bewertet wird, ist in der Vollzugspraxis noch nicht einheitlich geklärt.","20 years are proposed for the measure and 50 years for standard trees (Überhälter). How permanence is assessed under regular wood harvest has not yet been settled uniformly in enforcement practice."]]
  ];

  /* ---------------------------------------------------------------- Zustand */
  function leer(){
    return {
      gemeinde:"", lage:"", ziele:[],
      nutzung:"", wertManuell:"", offenland:"", biotop:"", verfuegbar:"", gapdzv:"",
      eigentum:"", dienstleister:"", waerme:"",
      mosaik:false, mehrreihig:false, a2:"keine", arten:false, gewaesser:false,
      eingabe:"flaeche", schlag:5, anzahl:3, laenge:1200, breite:12, saum:2, timeLag:null,
      notiz:""
    };
  }
  var S = leer();
  var step = 0, maxReached = 0, pruefen = false;
  function steps(){ return LANG==="en"
    ? ["Purpose","Site","Responsible body","Scale","Pre-consultation","Result"]
    : ["Anlass","Fläche","Träger","Größenordnung","Vorabstimmung","Ergebnis"]; }

  /* ---------------------------------------------------------------- Zahlen */
  function num(v){ return nf0.format(Math.round(v)); }
  function pc(v){ return num(v) + (LANG==="en" ? "%" : " %"); }
  function rund(v){ var a = Math.abs(v), st = a>=100000 ? 1000 : (a>=5000 ? 100 : 10); return Math.round(v/st)*st; }
  function eur(v){ return LANG==="en" ? "€" + nf0.format(rund(v)) : nf0.format(rund(v)) + " €"; }
  function pEur(v){ return LANG==="en" ? "€" + nf2.format(v) : nf2.format(v) + " €"; }
  function zahl(v){ var n = parseFloat(String(v).replace(",",".")); return isNaN(n) ? 0 : n; }
  function m(v){ return nfk.format(v) + " m"; }

  function richtwert(){ var a = AUSGANG[S.nutzung]; return a ? a.wert : null; }
  function ausgangswert(){
    if(!AUSGANG[S.nutzung]) return null;
    if(String(S.wertManuell).trim()==="") return null;
    var v = zahl(S.wertManuell);
    return (v>=0 && v<=24) ? v : null;
  }
  function eigenerWert(){ var aw = ausgangswert(); return aw!==null && aw!==richtwert(); }
  function achsenPunkte(){
    return (S.mosaik?1:0) + (S.mehrreihig?1:0) + (S.a2==="mittel"?3:(S.a2==="alt"?6:0)) +
           (S.arten?2:0) + (S.gewaesser?1:0);
  }
  function timeLagAuto(){ return S.a2==="alt" ? 1.5 : 1.2; }
  function timeLag(){ return S.timeLag===null ? timeLagAuto() : S.timeLag; }

  function calc(){
    var B = zahl(S.breite), b = zahl(S.saum);
    if(b*2 >= B) b = 0;
    var schlagM2 = zahl(S.schlag)*10000, n = Math.round(zahl(S.anzahl));
    var seite = Math.sqrt(schlagM2);
    var L = S.eingabe==="flaeche" ? n*seite : zahl(S.laenge);
    var fSaum = L * 2 * b;
    var fKern = L * (B - 2*b);
    var fGes  = L * B;
    var deckel = S.gewaesser ? 19 : 18;
    var ziel = Math.min(8 + achsenPunkte(), deckel);
    var tl = timeLag();
    var anrechenbar = ziel / tl;
    var aw = ausgangswert();
    var upKern = aw===null ? null : anrechenbar - aw;
    var upSaum = aw===null ? null : SAUMWERT - aw;
    var pKern = upKern===null ? 0 : fKern * upKern;
    var pSaum = upSaum===null ? 0 : fSaum * upSaum;
    var punkte = pKern + pSaum;
    var ha = fGes/10000;
    var k20 = ha * KOSTEN.voll20;
    var noetigGesamt = k20 / PREIS.mid;
    return {
      L:L, B:B, b:b, kernB:B-2*b, fSaum:fSaum, fKern:fKern, fGes:fGes, ha:ha,
      schlag:schlagM2, n:n, seite:seite,
      anteil: (S.eingabe==="flaeche" && schlagM2>0) ? fGes/schlagM2 : null,
      abstand: (S.eingabe==="flaeche" && n>0) ? seite/n - B : null,
      ziel:ziel, deckel:deckel, tl:tl, anrechenbar:anrechenbar, aw:aw,
      upKern:upKern, upSaum:upSaum, pKern:pKern, pSaum:pSaum, punkte:punkte,
      positiv: aw!==null && punkte>0,
      eMin:punkte*PREIS.min, eMid:punkte*PREIS.mid, eMax:punkte*PREIS.max,
      kAnlage:ha*KOSTEN.anlage, k20:k20,
      deckung: k20>0 ? (punkte*PREIS.mid)/k20 : 0,
      deckungMin: k20>0 ? (punkte*PREIS.min)/k20 : 0,
      deckungMax: k20>0 ? (punkte*PREIS.max)/k20 : 0,
      noetig: fGes>0 ? noetigGesamt/fGes : 0,
      istSchnitt: fGes>0 ? punkte/fGes : 0
    };
  }

  /* ---------------------------------------------------------------- Hinweise */
  function hinweise(i){
    var out = [];
    function note(q,t,k,mail){ out.push({q:q, art:"note", text:t, kurz:k||t, schritt:i, mail:mail||null}); }
    function warn(q,t,k,mail){ out.push({q:q, art:"warn", text:t, kurz:k||t, schritt:i, mail:mail||null}); }

    if(i===0 && S.ziele.length){
      var cash = S.ziele.indexOf("kompensation")>=0;
      var nurErtrag = S.ziele.every(function(z){ return z==="waerme" || z==="rohstoff"; });
      var ertrag = S.ziele.indexOf("waerme")>=0 || S.ziele.indexOf("rohstoff")>=0;
      if(!cash && !ertrag)
        note("ziele",
          T("Prüfen Sie auch Finanzierungsmöglichkeiten über die Hochwasservorsorge.",
            "Also check financing options through flood-risk prevention."),
          T("Finanzierung über die Hochwasservorsorge prüfen.","Check financing through flood-risk prevention."));
      if(nurErtrag)
        note("ziele",
          T("Rein ertragsorientierte Planungen qualifizieren in der Regel nicht für die Finanzierung über Naturschutzleistungen.",
            "Purely yield-oriented plans generally do not qualify for financing through nature conservation services."),
          T("Rein ertragsorientierte Planung: Finanzierung über Naturschutzleistungen in der Regel nicht möglich.","Purely yield-oriented planning: financing through nature conservation services generally not possible."));
    }
    if(i===1){
      var lanis = T(" Prüfen lässt sich das z. B. im Landschaftsinformationssystem der Naturschutzverwaltung Rheinland-Pfalz (LANIS)."," This can be checked, for example, in the landscape information system of the nature conservation administration of Rhineland-Palatinate (LANIS).");
      if(S.nutzung==="gruenHoch")
        note("nutzung",
          T("Auf artenreichem Grünland liegt der Ausgangswert bereits nahe am erreichbaren Zielwert. Tragen Sie möglichst den kartierten Wert ein. Die Bilanz trägt dort meist nur über den Saum oder über eine zusätzliche Aufwertung der Hauptkultur.",
            "On species-rich grassland the initial value is already close to the achievable target value. Enter the mapped value if possible. The balance there is usually positive only through the margin strip or through an additional uplift of the main crop."),
          T("Artenreiches Grünland: Ausgangswert nahe am Zielwert.","Species-rich grassland: initial value close to the target value."));
      if(S.offenland==="ja")
        warn("offenland",
          T("Mit der zuständigen unteren Naturschutzbehörde ist abzustimmen, ob Gehölze mit dem Schutzzweck vereinbar sind.",
            "It has to be agreed with the competent lower nature conservation authority whether woody plants are compatible with the protection purpose."),
          T("Offenland- oder Rastvogelgebiet: Vereinbarkeit mit dem Schutzzweck mit der UNB abstimmen.","Open-country or resting-bird area: agree compatibility with the protection purpose with the UNB."));
      if(S.offenland==="unklar")
        warn("offenland",
          T("Ob die Fläche in einem Offenland- oder Rastvogelgebiet liegt, ist noch nicht geprüft. Klären Sie das vor einer Anfrage bei der unteren Naturschutzbehörde.",
            "Whether the site lies in an open-country or resting-bird area has not yet been checked. Clarify this before making an enquiry to the lower nature conservation authority.")+lanis,
          T("Offenland- oder Rastvogelgebiet noch nicht geprüft: vor der Anfrage klären.","Open-country or resting-bird area not yet checked: clarify before the enquiry."));

  function alleHinweise(){
    var r = [];
    for(var i=0;i<4;i++) hinweise(i).forEach(function(h){ r.push(h); });
    return r;
  }

  /* Fehlende Pflichtangaben je Schritt (Schlüssel = data-need der Frage); das Feld "Lage" ist nie Pflicht */
  function fehlend(i){
    var f = [];
    if(i===0){ if(!S.ziele.length) f.push("ziele"); }
    if(i===1){
      if(!S.nutzung) f.push("nutzung");
      else if(ausgangswert()===null) f.push("wertManuell");
      ["offenland","biotop","verfuegbar","gapdzv"].forEach(function(k){ if(!S[k]) f.push(k); });
    }
    if(i===2) ["eigentum","dienstleister","waerme"].forEach(function(k){ if(!S[k]) f.push(k); });
    if(i===3){
      if(S.eingabe==="flaeche"){
        if(!(zahl(S.schlag)>0)) f.push("schlag");
        if(!(Math.round(zahl(S.anzahl))>0)) f.push("anzahl");
      } else if(!(zahl(S.laenge)>0)) f.push("laenge");
      if(!(zahl(S.breite)>0)) f.push("breite");
    }
    return f;
  }
  function fertig(i){ return fehlend(i).length===0; }
  function markUpdate(){
    var miss = pruefen ? fehlend(step) : [];
    var nodes = document.querySelectorAll("#main [data-need]");
    Array.prototype.forEach.call(nodes, function(n){
      var k = n.getAttribute("data-need"), on = miss.indexOf(k)>=0;
      n.classList.toggle("miss", on);
      var mm = n.querySelector(".missmsg");
      if(mm) mm.textContent = (k==="wertManuell" && String(S.wertManuell).trim()!=="")
        ? T("Bitte einen Ausgangswert zwischen 0 und 24 eintragen","Please enter an initial value between 0 and 24")
        : T("Angabe fehlt","Entry missing");
    });
  }

  /* ---------------------------------------------------------------- Render-Hilfen */
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function el(tag, attrs, html){
    var n = document.createElement(tag);
    if(attrs) for(var k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined) n.setAttribute(k, attrs[k]); }
    if(html!==undefined) n.innerHTML = html;
    return n;
  }
  function radios(name, legend, hint, options, current, cols){
    var h = '<fieldset data-need="'+name+'"><legend>'+legend+'</legend><div class="missmsg"></div>';
    if(hint) h += '<div class="hint">'+hint+'</div>';
    h += '<div class="'+(cols?"grid2":"opts")+'">';
    options.forEach(function(o){
      h += '<label class="opt"><input type="radio" name="'+name+'" value="'+o.v+'"'+(current===o.v?" checked":"")+'>'+
           '<span>'+esc(o.l)+(o.s?'<span class="sub">'+esc(o.s)+'</span>':'')+'</span></label>';
    });
    return h + '</div>';
  }
  function boxes(name, legend, hint, options, isOn, cols){
    var h = '<fieldset data-need="'+(name==="ziele"?"ziele":"")+'"><legend>'+legend+'</legend><div class="missmsg"></div>';
    if(hint) h += '<div class="hint">'+hint+'</div>';
    h += '<div class="'+(cols?"grid2":"opts")+'">';
    options.forEach(function(o){
      h += '<label class="opt"><input type="checkbox" name="'+name+'" value="'+o.v+'"'+(isOn(o.v)?" checked":"")+'>'+
           '<span>'+esc(o.l)+(o.s?'<span class="sub">'+esc(o.s)+'</span>':'')+'</span></label>';
    });
    return h + '</div>';
  }
  function fq(i,keys){ return flagsFor(hinweise(i).filter(function(x){ return keys.indexOf(x.q)>=0; })); }
  function flagsFor(list){
    return list.map(function(h){
      return '<div class="flag '+h.art+'"><span class="tag">'+(h.art==="warn"?T("Achtung","Warning"):T("Hinweis","Note"))+'</span><span class="ftxt">'+h.text+'</span></div>';
    }).join("");

  function schrittName(i){ return T("Schritt ","Step ")+(i+1)+" "+steps()[i]; }
  var YN = function(){ return [{v:"nein",l:T("nein","no")},{v:"ja",l:T("ja","yes")}]; };

  function querschnitt(c){
    if(!(c.B>0)) return "";
    var W = 520, H = 92, pad = 26, inner = W - 2*pad;
    var sb = c.B>0 ? (c.b / c.B) * inner : 0;
    var kern = inner - 2*sb;
    var y = 26, hgt = 34;
    function t(x,yy,txt,anchor,size,col){
      return '<text x="'+x+'" y="'+yy+'" text-anchor="'+(anchor||"middle")+'" font-size="'+(size||10)+
             '" fill="'+(col||"currentColor")+'" font-family="inherit">'+txt+'</text>';
    }
    var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+T("Querschnitt des Gehölzstreifens","Cross-section of the woody strip")+'" style="color:var(--ink-3)">';
    s += '<rect x="'+pad+'" y="'+y+'" width="'+sb+'" height="'+hgt+'" fill="var(--note-bg)" stroke="var(--note-line)"/>';
    s += '<rect x="'+(pad+sb)+'" y="'+y+'" width="'+kern+'" height="'+hgt+'" fill="var(--accent-2)" stroke="var(--accent)"/>';
    s += '<rect x="'+(pad+sb+kern)+'" y="'+y+'" width="'+sb+'" height="'+hgt+'" fill="var(--note-bg)" stroke="var(--note-line)"/>';
    s += t(pad+sb+kern/2, y+hgt/2+4, T("Kern "+nf1.format(c.kernB)+" m, Außenreihe zu Außenreihe","Core "+nf1.format(c.kernB)+" m, outer row to outer row"), "middle", 11, "var(--ink)");
    if(c.b>0){
      s += t(pad+sb/2, y-7, nf1.format(c.b)+" m", "middle", 10);
      s += t(pad+sb+kern+sb/2, y-7, nf1.format(c.b)+" m", "middle", 10);
      s += t(pad+sb/2, y+hgt+14, T("Saum","Margin"), "middle", 10);
      s += t(pad+sb+kern+sb/2, y+hgt+14, T("Saum","Margin"), "middle", 10);
    }
    s += '<line x1="'+pad+'" y1="'+(y+hgt+26)+'" x2="'+(W-pad)+'" y2="'+(y+hgt+26)+'" stroke="currentColor" stroke-width="1"/>';
    s += t(W/2, y+hgt+22, T("Breite des Gehölzstreifens "+nf1.format(c.B)+" m","Width of the woody strip "+nf1.format(c.B)+" m"), "middle", 10);
    s += '</svg>';
    return s;
  }

      if(S.nutzung){
        var rw = richtwert();
        h += '<div class="fields"><label class="f" data-need="wertManuell">'+T("Ausgangswert","Initial value")+' <span class="u">'+T("Punkte je m², ","points per m², ")+
             (rw!==null ? T("mit dem Richtwert vorbelegt, überschreibbar","preset to the guide value, can be overwritten") : T("bitte eintragen","please enter"))+'</span>'+
             '<input type="text" inputmode="decimal" id="wertManuell" value="'+esc(S.wertManuell)+'"><span class="missmsg"></span></label></div>'+
             '<div class="hint" style="margin-top:7px">'+T("Den Biotopwert der Fläche können Sie in Anlage 7.1 der Biotopwertliste nachschlagen: ","You can look up the biotope value of the site in Annex 7.1 of the biotope value list: ")+
             '<a href="'+LINK_LEITFADEN+'" target="_blank" rel="noopener">'+T("Praxisleitfaden zur Ermittlung des Kompensationsbedarfs in Rheinland-Pfalz","Practical guide to determining the compensation requirement in Rhineland-Palatinate (in German)")+'</a>.</div>';
      }
      h += fq(1,["nutzung"]) + '</fieldset>';

      h += radios("offenland",T("Liegt die Fläche in einem Offenland- oder Rastvogelgebiet?","Is the site in an open-country or resting-bird area?"), null,
        [{v:"nein",l:T("nein","no")},{v:"ja",l:T("ja","yes")},{v:"unklar",l:T("nicht geprüft","not checked")}], S.offenland, true);
      h += fq(1,["offenland"]) + '</fieldset>';

      h += radios("biotop",T("Liegt ein gesetzlich geschütztes Biotop auf der Fläche?","Is there a legally protected biotope on the site?"),
        T("Streuobstwiese, Magerrasen, Feuchtgrünland und andere Biotope nach § 30 BNatSchG.","Orchard meadow, nutrient-poor grassland, wet grassland and other biotopes under § 30 BNatSchG."),
        [{v:"nein",l:T("nein","no")},{v:"ja",l:T("ja","yes")},{v:"unklar",l:T("nicht geprüft","not checked")}], S.biotop, true);
      h += fq(1,["biotop"]) + '</fieldset>';

      h += radios("verfuegbar",T("Ist die Fläche über den gesamten Zeitraum des zu kompensierenden Eingriffs verfügbar?","Is the site available for the entire period of the intervention to be compensated?"), null,
        [{v:"ja",l:T("ja","yes")},{v:"nein",l:T("nein","no")},{v:"offen",l:T("noch offen","still open")}], S.verfuegbar, true);
      h += fq(1,["verfuegbar"]) + '</fieldset>';

      h += radios("gapdzv",T("Erfüllt das System die Anforderungen der Öko-Regelung 3?","Does the system meet the requirements of Eco-Scheme 3?"),
        T('Vorausgesetzt wird die Agroforstdefinition nach § 4 Abs. 2 GAPDZV. Die Anforderungen der Öko-Regelung 3 sind für eine Kompensationsmaßnahme rechtlich nicht vorgeschrieben; ihre Einhaltung ist aber meist hilfreich, weil sie einen anerkannten Qualitätsstandard belegt. '+
          'Eckpunkte: mindestens 2 Gehölzstreifen, je höchstens 25 m breit, Gehölzanteil 2 bis 40 % der Fläche, 20 bis 100 m Abstand zwischen den Streifen, Holzernte nur in den Monaten Dezember, Januar und Februar. '+
          'Ob neben der Kompensation zusätzlich die Förderung über die Öko-Regelung 3 möglich ist, ist derzeit offen. ',
          'The agroforestry definition under § 4 (2) GAPDZV (CAP direct payments ordinance) is assumed. The requirements of Eco-Scheme 3 are not legally prescribed for a compensation measure; compliance is usually helpful, however, because it demonstrates a recognised quality standard. '+
          'Key points: at least 2 woody strips, each at most 25 m wide, woody share 2 to 40% of the area, 20 to 100 m between the strips, wood harvest only in the months of December, January and February. '+
          'Whether the Eco-Scheme 3 subsidy can be claimed in addition to compensation is currently open. ')+
        '<a href="'+LINK_OER3+'" target="_blank" rel="noopener">'+T("Mehr zur Öko-Regelung 3","More on Eco-Scheme 3 (in German)")+'</a>',
        [{v:"ja",l:T("ja","yes")},{v:"nein",l:T("nein","no")},{v:"unklar",l:T("noch offen","still open")}], S.gapdzv, true);
      h += fq(1,["gapdzv"]) + '</fieldset>';
    }

    if(i===2){
      h += '<div class="eyebrow">'+of5+'</div><h2>'+T("Maßnahmenträger","Responsible body for the measure")+'</h2>';
      h += radios("eigentum",T("Wem gehört die Fläche?","Who owns the site?"), null,
        [{v:"betrieb",l:T("dem landwirtschaftlichen Betrieb","the farm")},{v:"kommune",l:T("der Kommune (Verpächterin)","the municipality (as lessor)")},{v:"dritte",l:T("einem Dritten","a third party")}],
        S.eigentum, true);
      h += fq(2,["eigentum"]) + '</fieldset>';
      h += radios("dienstleister",T("Soll die Planung der Pflanzung, Fertigstellungs- und Etablierungspflege der Maßnahme an einen spezialisierten Dienstleister vergeben werden?","Is the planning of the planting, completion care and establishment care of the measure to be awarded to a specialised service provider?"),
        null, [{v:"ja",l:T("ja","yes")},{v:"nein",l:T("nein","no")}], S.dienstleister, true);
      h += fq(2,["dienstleister"]) + '</fieldset>';
      h += radios("waerme",T("Ist im Rahmen der kommunalen Wärmeplanung die Erzeugung von Holzhackschnitzeln interessant?","Is the production of wood chips of interest within the framework of municipal heat planning?"),
        null, [{v:"ja",l:T("ja","yes")},{v:"nein",l:T("nein","no")},{v:"offen",l:T("noch offen","still open")}], S.waerme, true);
      h += fq(2,["waerme"]) + '</fieldset>';
    }

    if(i===3){
      c = calc();
      h += '<div class="eyebrow">'+of5+'</div><h2>'+T("Trägt der Erlös aus Wertpunkten die Agroforst-Maßnahme?","Does the revenue from value points support the agroforestry measure?")+'</h2>'+
           '<p class="intro">'+T("Überschlägige Prognose, kein Ersatz für eine gutachterliche Bilanzierung.","Rough forecast, not a substitute for an expert assessment.")+'</p>';

      h += '<div class="divider"></div>';
      h += boxes("achsen",T("Was ist geplant?","What is planned?"),
        T("Jedes Merkmal hebt den Zielwert des Gehölzkerns. Ohne diese Merkmale wird eine angenommene durchschnittliche Basisausprägung mit überwiegend schnellwachsenden Gehölzen mit 8 Punkten angesetzt. Ob die Punkte so anerkannt werden, ist mit der unteren Naturschutzbehörde abzustimmen.",
          "Each feature raises the target value of the woody core. Without these features an assumed average baseline with predominantly fast-growing woody plants is rated at 8 points. Whether the points are recognised in this way has to be agreed with the lower nature conservation authority."),[
        {v:"mosaik", l:T("Nutzungsmosaik, +1 Punkt","Harvest mosaic, +1 point"), s:T("mindestens 3 zeitversetzt geerntete Abschnitte","at least 3 sections harvested at different times")},
        {v:"mehrreihig", l:T("Mehrreihigkeit, +1 Punkt","Multi-row planting, +1 point"), s:T("pro Gehölzstreifen mindestens 4 Reihen oder 10 m Breite","at least 4 rows or 10 m width per woody strip")},
        {v:"arten", l:T("Artenvielfalt, +2 Punkte","Species diversity, +2 points"), s:T("mindestens 3 standortheimische oder ökologisch besonders wertvolle Arten, die 10 % der Individuen als Überhälter oder 50 % im Unterbau stellen","at least 3 site-native or ecologically particularly valuable species that make up 10% of individuals as standard trees (Überhälter) or 50% in the understorey")},
        {v:"gewaesser", l:T("Gewässerbegleitend, +1 Punkt","Along a watercourse, +1 point"), s:T("über mindestens 80 % der Uferlinie, im Abstand von höchstens 5 m","along at least 80% of the bank line, at a distance of at most 5 m")}
      ], function(v){ return !!S[v]; }, true) + '</fieldset>';
      h += radios("a2",T("Ernteintervall und Standzeit","Harvest interval and standing time"),
        null,[
        {v:"keine", l:T("Ernteintervall unter 10 Jahren, keine Überhälter","harvest interval under 10 years, no standard trees"), s:T("Basisausprägung","baseline")},
        {v:"mittel", l:T("Ernteintervall ab 10 Jahren, keine Überhälter, +3 Punkte","harvest interval from 10 years, no standard trees, +3 points"), s:T("auf mindestens 20 % der Gehölzfläche","on at least 20% of the woody area")},
        {v:"alt", l:T("Überhälter mit 50 Jahren Standzeit, +6 Punkte","Standard trees (Überhälter) with 50 years standing time, +6 points"), s:T("auf mindestens 10 % der Individuen, entspricht im Zielzustand über 20 % der Beschirmung","on at least 10% of individuals, equivalent to over 20% canopy cover in the target condition")}
      ], S.a2, false) + '</fieldset>';

      h += '<div class="divider"></div>';
      h += '<fieldset style="margin-top:10px"><legend>'+T("Was wissen Sie über die Gehölzstreifen?","What do you know about the woody strips?")+'</legend><div class="seg">'+
           '<label><input type="radio" name="eingabe" value="flaeche"'+(S.eingabe==="flaeche"?" checked":"")+'>'+T("Flächengröße und Anzahl der Streifen","Field size and number of strips")+'</label>'+
           '<label><input type="radio" name="eingabe" value="laenge"'+(S.eingabe==="laenge"?" checked":"")+'>'+T("Gesamtlänge der Streifen","Total length of the strips")+'</label>'+
           '</div></fieldset>';
      h += '<div class="fields">';
      if(S.eingabe==="flaeche"){
        h += '<label class="f" data-need="schlag">'+T("Größe des Schlags","Field size")+' <span class="u">ha</span>'+
               '<input type="text" inputmode="decimal" id="schlag" value="'+esc(S.schlag)+'"><span class="missmsg"></span></label>'+
             '<label class="f" data-need="anzahl">'+T("Anzahl der Gehölzstreifen","Number of woody strips")+' <span class="u">'+T("Stück","count")+'</span>'+
               '<input type="text" inputmode="numeric" id="anzahl" value="'+esc(S.anzahl)+'"><span class="missmsg"></span></label>';
      } else {
        h += '<label class="f" data-need="laenge">'+T("Länge der Gehölzstreifen","Length of the woody strips")+' <span class="u">'+T("m, alle Streifen zusammen","m, all strips together")+'</span>'+
               '<input type="text" inputmode="decimal" id="laenge" value="'+esc(S.laenge)+'"><span class="missmsg"></span></label>';
      }
      h += '<label class="f" data-need="breite">'+T("Breite der Gehölzstreifen","Width of the woody strips")+' <span class="u">'+T("m je Streifen, inklusive Saum","m per strip, including margin strip")+'</span>'+
          '<input type="text" inputmode="decimal" id="breite" value="'+esc(S.breite)+'"><span class="missmsg"></span></label>'+
        '<label class="f">'+T("Saumbreite je Seite","Margin strip width per side")+' <span class="u">m</span><select id="saum">'+
          SAUM_OPT.map(function(b){
            var raus = (b>0 && 2*b >= zahl(S.breite));
            return '<option value="'+b+'"'+(zahl(S.saum)===b?" selected":"")+(raus?" disabled":"")+'>'+
                   (b===0 ? T("kein anrechenbarer Saum","no creditable margin strip") : m(b))+'</option>';
          }).join("")+
        '</select></label>'+
        '<label class="f">'+T("Entwicklungsdauer bis zum Zielzustand (Time-Lag-Faktor)","Development time to target condition (time-lag factor)")+'<select id="timeLag">'+
          [[1,T("1,0 · unter 5 Jahre","1.0 · under 5 years")],[1.2,T("1,2 · 5 bis 10 Jahre","1.2 · 5 to 10 years")],[1.5,T("1,5 · 10 bis 30 Jahre","1.5 · 10 to 30 years")],[2,T("2,0 · über 30 Jahre","2.0 · over 30 years")]]
          .map(function(o){ return '<option value="'+o[0]+'"'+(timeLag()===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("")+
        '</select></label>'+
        '</div>';
      h += '<div class="hint" style="margin-top:9px">'+
        T("Der Faktor gibt an, wie lange die Gehölze bis zum Zielzustand brauchen: 1,0 bei unter 5 Jahren, 1,2 bei 5 bis 10, 1,5 bei 10 bis 30 und 2,0 bei über 30 Jahren. Der Zielwert wird durch den Faktor geteilt; je länger die Entwicklung dauert, desto weniger Punkte sind anrechenbar. Vorbelegt ist 1,2, mit Überhältern 1,5; Sie können den Faktor überschreiben.",
          "The factor states how long the woody plants need to reach the target condition: 1.0 for under 5 years, 1.2 for 5 to 10, 1.5 for 10 to 30 and 2.0 for over 30 years. The target value is divided by the factor; the longer the development takes, the fewer points are creditable. The preset is 1.2, or 1.5 with standard trees; you can overwrite the factor.")+'</div>';
      h += '<div id="calcOut">'+calcOutHTML()+'</div>';
    }

    if(i===4){
      h += '<div class="eyebrow">'+of5+'</div><h2>'+T("Womit Sie in die Vorabstimmung gehen","What you take into the pre-consultation")+'</h2>'+
           '<p class="intro">'+T("Zusammengestellt ist, was aus Ihren Angaben folgt und was sich unabhängig vom Einzelfall erst im Gespräch mit der unteren Naturschutzbehörde klärt.",
             "Compiled below is what follows from your entries and what, regardless of the individual case, is only settled in the conversation with the lower nature conservation authority.")+'</p>';
      h += '<div class="section-head">'+T("Der Weg im Überblick","The process at a glance")+'</div>';
      h += '<div class="flowwrap">';
      h += '<div class="flowhead"><span class="k">'+T("Phase 1 bis 4","Phases 1 to 4")+'</span><span class="v">'+T("Vorbereiten, abstimmen, planen, sichern","Prepare, consult, plan, secure")+'</span></div>';
      h += '<div class="cards">' + ABLAUF.slice(0,4).map(karte).join("") + '</div>';
      h += '<div class="flowhead"><span class="k">'+T("Phase 5 bis 8","Phases 5 to 8")+'</span><span class="v">'+T("Anerkennen, pflanzen, nachweisen, erhalten","Recognise, plant, document, maintain")+'</span></div>';
      h += '<div class="cards">' + ABLAUF.slice(4).map(karte).join("") + '</div>';
      h += '<div class="flownote">'+T("Die Phasen 1 bis 3 sind eine Abstimmungsschleife, keine Einbahnstraße.","Phases 1 to 3 form a feedback loop, not a one-way street.")+'</div>';
      h += '<div class="erloes"><b>'+T("Erlös","Revenue")+'</b><span>'+T("Nicht an die Reihenfolge gebunden. Er entsteht mit der Zuordnung zu einem Eingriff, nicht mit der Pflanzung, und steht dem Berechtigten der Wertpunkte zu.",
        "Not tied to the sequence. It arises when the value points are assigned to an intervention, not with the planting, and belongs to whoever holds the entitlement to the value points.")+'</span></div>';
      h += '</div>';

      var hs = alleHinweise();
      h += '<div class="section-head">'+T("Aus Ihren Angaben","From your entries")+'</div>';
      h += hs.length
        ? '<ul class="plain">'+hs.map(function(x){ return '<li><span class="mark"></span><span>'+x.kurz+
            ' <span class="counter">('+T("Angabe in ","entry in ")+schrittName(x.schritt)+')</span></span></li>'; }).join("")+'</ul>'
        : '<div class="hint" style="margin-top:8px">'+T("Aus dem Durchlauf ist nichts offengeblieben.","Nothing was left open in this run-through.")+'</div>';

      h += '<div class="section-head">'+T("Was sich erst im Gespräch mit der UNB klärt","What is only settled in the conversation with the UNB")+'</div>';
      h += '<ul class="plain">'+FESTE_PUNKTE.map(function(p){
             return '<li><span class="mark"></span><span><b>'+esc(P(p[0]))+'</b> '+esc(P(p[1]))+'</span></li>'; }).join("")+'</ul>';

      h += '<fieldset><legend>'+T("Eigene Punkte","Your own points")+'</legend><div class="hint">'+T("Erscheinen auf dem Ergebnisblatt und in der Maßnahmenskizze.","Appear on the result sheet and in the measure sketch.")+'</div>'+
           '<textarea id="notiz" placeholder="'+esc(T("Was Sie außerdem ansprechen wollen","Anything else you want to raise"))+'">'+esc(S.notiz)+'</textarea></fieldset>';
    }
    return h;
  }

  function kostenText(){
    return T("Die Kosten stammen von einem einzelnen Standort, dem Agroforstsystem Gonbach am Hofgut Neumühle (Donnersbergkreis), das das Institut für angewandtes Stoffstrommanagement (IfaS) als Forschungsvorhaben geplant, umgesetzt und beforscht hat. Gepflanzt 2025: rund 2,0 ha Gehölzfläche in 6 Streifen mit rund 1.600 Gehölzen je Hektar Gehölzfläche, überwiegend Hybridpappeln, dazu Wert- und Fruchthölzer, darunter 7 heimische Arten. Eingerechnet sind Pflanzgut, Baumschutz sowie Arbeit und Maschinen für Anlage und Pflege im ersten Standjahr (rund 9.000 € je Hektar, netto) und für die Mindeststandzeit von 20 Jahren zusätzlich 3 Ernten und die Rekultivierung (zusammen rund 28.000 € je Hektar). Nicht eingerechnet sind Planung und fachliche Begleitung, Kartierung, Eintragung und rechtliche Sicherung, Entwicklungsnachweise, Vermarktung und der entgangene Deckungsbeitrag der Fläche. Die Anlage ist keine anerkannte Kompensationsmaßnahme. Für eine Kompensationsmaßnahme liegen die Kosten wegen dieser Verfahrensschritte voraussichtlich höher. Die Werte ersetzen keine eigene Kalkulation.",
      "The costs come from a single site, the Gonbach agroforestry system at Hofgut Neumühle (Donnersbergkreis), which the Institute for Applied Material Flow Management (IfaS) planned, implemented and studied as a research project. Planted in 2025: about 2.0 ha of woody area in 6 strips with about 1,600 woody plants per hectare of woody area, mainly hybrid poplars, plus valuable and fruit trees, including 7 native species. Included are planting stock, tree protection, and labour and machinery for establishment and care in the first year (about €9,000 per hectare, net) and, for the minimum standing time of 20 years, an additional 3 harvests and the restoration (together about €28,000 per hectare). Not included are planning and professional supervision, mapping, registration and legal securing, development proofs, marketing and the lost contribution margin of the land. The plantation is not a recognised compensation measure. For a compensation measure the costs are likely to be higher because of these procedural steps. The values do not replace your own calculation.");
  }
  function kostenKasten(){ return '<div class="costbox"><b>'+T("Zur Kostenannahme","On the cost assumption")+'</b>'+esc(kostenText())+'</div>'; }

  function calcOutHTML(){
    var c = calc(), o = "";
    if(S.eingabe==="flaeche" && c.n>0 && c.schlag>0)
      o += '<div class="hint" style="margin-top:9px">'+
           T('Grober Überschlag: Angenommen ist ein annähernd quadratischer Schlag, die Streifen laufen über die ganze Länge. Daraus rund '+num(c.seite)+' m je Streifen, zusammen '+num(c.L)+' m. Bei langgestreckten Schlägen mit Streifen in Längsrichtung ist die Länge größer; wenn Sie sie kennen, rechnen Sie mit der Gesamtlänge genauer.',
             'Rough estimate: the field is assumed to be roughly square, with the strips running along its full length. This gives about '+num(c.seite)+' m per strip, '+num(c.L)+' m in total. For elongated fields with strips along the long side the length is larger; if you know it, calculating with the total length is more accurate.')+'</div>';
    o += '<div class="cut">'+querschnitt(c)+'</div>';
    o += fq(3,["saum","masse"]);
    o += '<div class="hint" style="margin-top:9px">'+T("Daraus: Gehölzfläche ","Result: woody area ")+nf2.format(c.ha)+' ha'+
         (c.anteil!==null ? ' ('+pc(c.anteil*100)+T(" des Schlags"," of the field")+')' : '')+
         T(', davon Kern ',', of which core ')+num(c.fKern)+' m² '+T('und Saum ','and margin strip ')+num(c.fSaum)+' m².</div>';

    o += '<div class="section-head">'+T("Überschlag","Rough estimate")+'</div>';
    var awS = c.aw===null ? "–" : nf1.format(c.aw);
    o += '<div class="tblwrap"><table class="rtable">'+
      '<tr><th></th><th>'+T("Rechnung","Calculation")+'</th><th style="text-align:right">'+T("Wertpunkte","Value points")+'</th></tr>'+
      '<tr><td>'+T("Gehölzkern","Woody core")+'</td><td>'+T("Zielwert "+c.ziel+" geteilt durch "+nf1.format(c.tl)+" = "+nf1.format(c.anrechenbar)+", abzüglich Ausgangswert "+awS,
          "Target value "+c.ziel+" divided by "+nf1.format(c.tl)+" = "+nf1.format(c.anrechenbar)+", minus initial value "+awS)+'</td>'+
        '<td class="n">'+(c.aw===null?"–":num(c.pKern))+'</td></tr>'+
      '<tr><td>'+T("Saum","Margin strip")+'</td><td>'+(c.fSaum>0 ? T('16 Punkte ohne Time-Lag, abzüglich Ausgangswert '+awS,'16 points without time lag, minus initial value '+awS) : T('kein anrechenbarer Saum','no creditable margin strip'))+'</td>'+
        '<td class="n">'+(c.aw===null||c.fSaum===0?"–":num(c.pSaum))+'</td></tr>'+
      '<tr class="sum"><td>'+T("Wertpunkte gesamt","Total value points")+'</td><td></td><td class="n">'+(c.aw===null?"–":num(c.punkte))+'</td></tr>'+
      '</table></div>';
    o += '<div class="tblwrap"><table class="rtable"><caption>'+T("Erlös und Kosten, Beträge gerundet","Revenue and costs, amounts rounded")+'</caption>'+
      '<tr><th></th><th>'+T("Bezug","Basis")+'</th><th style="text-align:right">'+T("Betrag","Amount")+'</th></tr>';
    if(c.positiv){
      o += '<tr><td>'+T("Erlös bei "+pEur(0.5)+" je Punkt","Revenue at "+pEur(0.5)+" per point")+'</td><td></td><td class="n">'+eur(c.eMin)+'</td></tr>'+
           '<tr><td>'+T("Erlös bei "+pEur(1.5)+" je Punkt","Revenue at "+pEur(1.5)+" per point")+'</td><td>'+T("mittlerer angenommener Marktwert","mid assumed market value")+'</td><td class="n">'+eur(c.eMid)+'</td></tr>'+
           '<tr><td>'+T("Erlös bei "+pEur(3)+" je Punkt","Revenue at "+pEur(3)+" per point")+'</td><td></td><td class="n">'+eur(c.eMax)+'</td></tr>';
    } else {
      o += '<tr><td>'+T("Erlös aus Wertpunkten","Revenue from value points")+'</td><td>'+T("keine Aufwertung","no uplift")+'</td><td class="n">'+T("entfällt","n/a")+'</td></tr>';
    }
    var basis = nf2.format(c.ha)+T(" ha Gehölzfläche (inkl. Saum), nach einem Einzelfall (siehe Kostenannahme)"," ha woody area (incl. margin strip), based on a single case (see cost assumption)");
    o += '<tr><td>'+T("Kosten Anlage und erstes Standjahr, geschätzt","Costs of establishment and first year, estimated")+'</td><td>'+basis+'</td><td class="n">'+eur(c.kAnlage)+'</td></tr>'+
      '<tr class="sum"><td>'+T("Vollkosten über 20 Jahre, geschätzt","Full costs over 20 years, estimated")+'</td><td>'+basis+'</td><td class="n">'+eur(c.k20)+'</td></tr>'+
      '</table></div>';
    o += kostenKasten();
    if(c.aw!==null){
      o += '<div style="margin-top:14px">'+(c.positiv
        ? '<span class="chip '+(c.deckung>=1?"ok":"note")+'">'+(c.deckung>=1
            ? T("Erlös deckt die geschätzten Vollkosten im mittleren Preisfall ("+pc(c.deckung*100)+") (Kosten nach einem Einzelfall, siehe Kostenannahme)","Revenue covers the estimated full costs in the mid-price case ("+pc(c.deckung*100)+") (costs based on a single case, see cost assumption)")
            : T("Erlös deckt im mittleren Preisfall nur "+pc(c.deckung*100)+" der geschätzten Vollkosten (Kosten nach einem Einzelfall, siehe Kostenannahme)","In the mid-price case revenue covers only "+pc(c.deckung*100)+" of the estimated full costs (costs based on a single case, see cost assumption)"))+'</span>'
        : '<span class="chip warn">'+T("Keine Aufwertung: Eingriff, keine Kompensationsmaßnahme","No uplift: intervention, not a compensation measure")+'</span>')+'</div>';
    }
    o += fq(3,["rechnung"]);
    o += '<div class="hint" style="margin-top:12px">'+
         T('Die angekreuzten Merkmale müssen später im Pflanzplan festgeschrieben werden, sonst sind sie nicht anrechenbar.',

  function mailText(){
    var c = calc(), hs = alleHinweise().filter(function(x){ return x.art==="warn" || x.mail; });
    var wa = [];
    if(S.mosaik) wa.push(T("Nutzungsmosaik mit mindestens 3 zeitversetzt geernteten Abschnitten, damit stets Gehölze unterschiedlichen Alters und durchgehend Deckung und Rückzugsraum bestehen","harvest mosaic with at least 3 sections harvested at different times, so that woody plants of different ages and continuous cover and refuge are always present"));
    if(S.mehrreihig) wa.push(T("pro Gehölzstreifen mindestens 4 Reihen beziehungsweise 10 m Streifenbreite, damit neben den Randbereichen ein geschützter Innenbereich entsteht und sich unterschiedliche Lebensräume ausbilden (Ökotoneffekt)","at least 4 rows or 10 m strip width per woody strip, so that a sheltered interior forms in addition to the edge zones and different habitats develop (ecotone effect)"));
    if(S.a2==="mittel") wa.push(T("Ernteintervall ab 10 Jahren auf mindestens 20 % der Gehölzfläche, sodass sich ältere, strukturreichere Bestände entwickeln","harvest interval of 10 years or more on at least 20% of the woody area, so that older, more structurally rich stands develop"));
    if(S.a2==="alt") wa.push(T("Überhälter mit 50 Jahren Standzeit auf mindestens 10 % der Individuen (entspricht im Zielzustand über 20 % der Beschirmung), die als Altbäume Lebensraum für Vögel, Fledermäuse und holzbewohnende Insekten bieten","standard trees (Überhälter) with 50 years standing time on at least 10% of individuals (equivalent to over 20% canopy cover in the target condition), which as old trees provide habitat for birds, bats and wood-dwelling insects"));
    if(S.arten) wa.push(T("mindestens 3 standortheimische oder ökologisch wertvolle Arten, um das Blüten- und Fruchtangebot über das Jahr zu verlängern","at least 3 site-native or ecologically valuable species, to extend the supply of blossom and fruit through the year"));
    if(S.gewaesser) wa.push(T("gewässerbegleitender Verlauf, als Puffer gegen Einträge ins Gewässer und als Vernetzungsachse","course along a watercourse, as a buffer against inputs into the water and as a connecting axis"));
    if(S.saum>0) wa.push(T("Saum von " + m(S.saum) + " je Seite, als strukturreicher Übergang zwischen Gehölz und Nutzfläche","margin strip of " + m(S.saum) + " per side, as a structurally rich transition between woody plants and farmland"));
    var eig = {betrieb:T("Fläche im Eigentum des Betriebs","land owned by the farm"), kommune:T("Fläche im Eigentum der Kommune","land owned by the municipality"), dritte:T("Fläche im Eigentum eines Dritten","land owned by a third party")}[S.eigentum] || T("Eigentum noch nicht geklärt","ownership not yet clarified");
    var nutz = AUSGANG[S.nutzung] ? P(AUSGANG[S.nutzung].label) : T("Ausgangsnutzung offen","current land use open");
    var t = "";
    t += T("Betreff: Vorabstimmung Agroforstsystem als produktionsintegrierte Kompensation","Subject: Pre-consultation on an agroforestry system as production-integrated compensation")+(S.gemeinde?": "+S.gemeinde:"")+"\n\n";
    t += T("Sehr geehrte Damen und Herren,\n\n","Dear Sir or Madam,\n\n");
    t += T("wir prüfen"+(S.gemeinde?" für "+S.gemeinde:"")+", ob ein Agroforstsystem als produktionsintegrierte Kompensationsmaßnahme angelegt werden kann, und möchten das Vorhaben frühzeitig und unverbindlich mit Ihnen abstimmen.\n\n",
           "we are examining"+(S.gemeinde?" for "+S.gemeinde:"")+" whether an agroforestry system can be established as a production-integrated compensation measure, and would like to discuss the project with you early and without obligation.\n\n");
    t += T("Vorhaben\n","Project\n");
    t += "- "+nutz+", "+flaechenText(c)+"\n";
    t += "- "+eig+"\n";
    if(S.waerme==="ja") t += T("- Hackschnitzel sollen in die Wärmenutzung gehen\n","- Wood chips are to go into heat use\n");
    t += "\n";
    if(wa.length){ t += T("Geplante Ausgestaltung\n","Planned design\n")+"- "+wa.join("\n- ")+"\n\n"; }
    t += T("Überschlag\n","Rough estimate\n");
    if(c.positiv)
      t += T("Zielwert Gehölzkern "+c.ziel+" Punkte, Time-Lag "+nf1.format(c.tl)+", Saum 16 Punkte; zusammen rund "+num(c.punkte)+" Wertpunkte. ",
             "Target value of the woody core "+c.ziel+" points, time lag "+nf1.format(c.tl)+", margin strip 16 points; together about "+num(c.punkte)+" value points. ");
    else
      t += T("Nach dem Überschlag ergibt sich auf dieser Fläche keine Aufwertung. ","According to the rough estimate, no uplift results on this site. ");
    t += T("Da die Biotopwertliste keinen Biotoptyp für Agroforst führt, ist der Zielwert über eine Analogie zu Hecken und Baumreihen hergeleitet (Weitz, 2026).\n\n",
           "As the biotope value list contains no biotope type for agroforestry, the target value is derived by analogy with hedges and tree rows (Weitz, 2026).\n\n");
    t += T("Wir würden zu diesem Vorhaben gern in einen offenen Austausch mit Ihnen treten. Klärungsbedarf sehen wir vor allem bei folgenden Punkten:\n",
           "We would like to enter into an open exchange with you on this project. We see a need for clarification mainly on the following points:\n");
    mailFragen(c).forEach(function(f){ t += "- "+f+"\n"; });
    hs.forEach(function(x){ t += "- "+(x.mail || x.kurz)+"\n"; });
    if(S.notiz.trim()) S.notiz.trim().split("\n").forEach(function(z){ if(z.trim()) t += "- "+z.trim()+"\n"; });
    t += T("\nÜber einen Ortstermin oder ein kurzes Gespräch würden wir uns freuen.\n\n","\nWe would welcome a site visit or a short conversation.\n\n");
    t += T("Mit freundlichen Grüßen\n\n","Kind regards\n\n");
    t += "--\n"+T("Erstellt mit dem Entscheidungswerkzeug „Agroforst als Kompensation: Vorprüfung für Kommunen“: ","Created with the decision tool “Agroforestry as compensation: pre-check for municipalities”: ")+P(LINK_WERKZEUG_P)+"\n";
    t += T("Quelle der Zielwerte: ","Source of the target values: ")+quelleText()+"\n";
    return t;
  }

  function heute(){
    return LANG==="en"
      ? new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})
      : new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
  }

  function buildModel(){
    var c = calc(), hs = alleHinweise(), aw = c.aw, pos = c.positiv;
    var warns = hs.filter(function(x){ return x.art==="warn"; });
    var notes = hs.filter(function(x){ return x.art==="note"; });
    var zielText = {klima:T("Klimaschutz und Klimaanpassung","climate protection and adaptation"), waerme:T("Wärme und regionale Wertschöpfung","heat and regional value creation"),
      kompensation:T("eigener Kompensationsbedarf","own compensation need"), rohstoff:T("Rohstoffe und lokale Wirtschaft","raw materials and local economy")};
    var M = {c:c, warns:warns, gem:(S.gemeinde.trim() || T("Ohne Bezeichnung","Unnamed")), datum:heute()};

    M.chip = warns.length
      ? {k:"warn", t:T(warns.length+(warns.length>1?" Punkte sind":" Punkt ist")+" vor der Planung zu klären", warns.length+(warns.length>1?" points have":" point has")+" to be clarified before planning")}
      : {k:"ok", t:T("Keine Warnhinweise aus den Angaben. Die Abstimmung mit der UNB steht aus.","No warnings from your entries. Consultation with the UNB is still to come.")};

    var dMin = pc(c.deckungMin*100)+T(" bis "," to ")+pc(c.deckungMax*100);
    M.kpis = pos ? [
      {k:T("Wertpunkte","Value points"), v:num(c.punkte), s:T("Gehölzkern "+num(c.pKern)+", Saum "+num(c.pSaum),"Woody core "+num(c.pKern)+", margin strip "+num(c.pSaum))},
      {k:T("Erlös, mittlerer Preisfall","Revenue, mid-price case"), v:T("rund ","about ")+eur(c.eMid), s:T("Spanne "+eur(c.eMin)+" bis "+eur(c.eMax),"Range "+eur(c.eMin)+" to "+eur(c.eMax))},
      {k:T("Deckung der Vollkosten","Coverage of full costs"), v:pc(c.deckung*100), s:T("Spanne "+dMin+", geschätzte Vollkosten "+eur(c.k20),"Range "+dMin+", estimated full costs "+eur(c.k20))}
    ] : [
      {k:T("Wertpunkte","Value points"), v:(aw===null?"–":num(c.punkte)), s:T("Keine Aufwertung: Eingriff, keine Kompensationsmaßnahme","No uplift: intervention, not a compensation measure")},
      {k:T("Erlös","Revenue"), v:T("entfällt","n/a"), s:T("keine Wertpunkte","no value points")},
      {k:T("Deckung der Vollkosten","Coverage of full costs"), v:T("entfällt","n/a"), s:T("geschätzte Vollkosten "+eur(c.k20),"estimated full costs "+eur(c.k20))}
    ];
    M.low = (pos && c.deckungMin<1) ? T("Im unteren Preisfall (0,50 € je Punkt) decken die Erlöse die geschätzten Vollkosten nicht.","In the low-price case (€0.50 per point), revenue does not cover the estimated full costs.") : "";

    M.konst = [
      [T("Ziele","Goals"), S.ziele.length ? S.ziele.map(function(z){ return zielText[z]; }).join(", ") : T("noch nicht benannt","not yet specified")],
      [T("Ausgangsnutzung","Current land use"), (AUSGANG[S.nutzung] ? P(AUSGANG[S.nutzung].label) : T("noch nicht benannt","not yet specified"))+
        (aw!==null ? T(", Ausgangswert "+nf1.format(aw)+" Punkte je m²",", initial value "+nf1.format(aw)+" points per m²")+
          (eigenerWert() ? T(" (eigener Wert"+(richtwert()!==null?", Richtwert "+richtwert():"")+")"," (own value"+(richtwert()!==null?", guide value "+richtwert():"")+")") : (richtwert()!==null?T(" (Richtwert)"," (guide value)"):"")) : "")],
      [T("Flächen","Areas"), flaechenText(c)]
    ].concat(rolle());

    var tei = [T("8 Basisausprägung","8 baseline")];
    if(S.mosaik) tei.push(T("1 Nutzungsmosaik","1 harvest mosaic"));
    if(S.mehrreihig) tei.push(T("1 Mehrreihigkeit","1 multi-row planting"));
    if(S.a2==="mittel") tei.push(T("3 Ernteintervall ab 10 Jahren","3 harvest interval from 10 years"));
    if(S.a2==="alt") tei.push(T("6 Überhälter","6 standard trees"));
    if(S.arten) tei.push(T("2 Artenvielfalt","2 species diversity"));
    if(S.gewaesser) tei.push(T("1 Gewässerlage","1 watercourse location"));
    var capped = (8+achsenPunkte()) > c.deckel;
    M.herl = [
      [T("Zielwert Gehölzkern","Target value, woody core"), c.ziel+T(" Punkte (",(" points (")+"")+tei.join(" + ")+(capped?T("; gedeckelt bei ","; capped at ")+c.deckel:"")+")"],
      [T("Entwicklungsdauer (Time-Lag)","Development time (time lag)"), T("Faktor "+nf1.format(c.tl)+": "+c.ziel+" geteilt durch "+nf1.format(c.tl)+" = "+nf1.format(c.anrechenbar)+" Punkte anrechenbar",
         "Factor "+nf1.format(c.tl)+": "+c.ziel+" divided by "+nf1.format(c.tl)+" = "+nf1.format(c.anrechenbar)+" points creditable")],
      [T("Saum","Margin strip"), c.fSaum>0 ? T(SAUMWERT+" Punkte ohne Time-Lag, "+m(c.b)+" je Seite",SAUMWERT+" points without time lag, "+m(c.b)+" per side") : T("kein anrechenbarer Saum","no creditable margin strip")]
    ];

    function d1(v){ return aw===null ? "–" : nf1.format(v); }
    M.tabKopf = LANG==="en"
      ? ["Part","Area","Creditable target value","Initial value","Uplift per m²","Value points"]
      : ["Teilfläche","Fläche","Zielwert anrechenbar","Ausgangswert","Aufwertung je m²","Wertpunkte"];
    M.tab = [[T("Gehölzkern","Woody core"), num(c.fKern)+" m²", nf1.format(c.anrechenbar), d1(aw), aw===null?"–":nf2.format(c.upKern), aw===null?"–":num(c.pKern)]];
    if(c.fSaum>0) M.tab.push([T("Saum","Margin strip"), num(c.fSaum)+" m²", nf1.format(SAUMWERT), d1(aw), aw===null?"–":nf2.format(c.upSaum), aw===null?"–":num(c.pSaum)]);
    M.tabSumme = [T("Gesamt","Total"), num(c.fGes)+" m²", "", "", "", aw===null?"–":num(c.punkte)];

    M.geld = [
      [T("Erlös","Revenue"), pos ? T("rund "+eur(c.eMid)+" im mittleren Preisfall (1,50 € je Punkt); Spanne "+eur(c.eMin)+" bis "+eur(c.eMax)+" bei 0,50 bis 3,00 € je Punkt",
                                    "about "+eur(c.eMid)+" in the mid-price case (€1.50 per point); range "+eur(c.eMin)+" to "+eur(c.eMax)+" at €0.50 to €3.00 per point")
                                 : T("entfällt, keine Aufwertung","n/a, no uplift")],
      [T("Kosten, geschätzt","Costs, estimated"), T("Anlage und erstes Standjahr rund "+eur(c.kAnlage)+"; Vollkosten über 20 Jahre rund "+eur(c.k20)+". Mögliche Kosten nach einem einzelnen untersuchten Standort eines Forschungsvorhabens, keine Kalkulation.",
                                                    "Establishment and first year about "+eur(c.kAnlage)+"; full costs over 20 years about "+eur(c.k20)+". Possible costs based on a single studied site of a research project, not a calculation.")],
      [T("Deckung","Coverage"), pos ? T(pc(c.deckung*100)+" der geschätzten Vollkosten im mittleren Preisfall; Spanne "+dMin, pc(c.deckung*100)+" of the estimated full costs in the mid-price case; range "+dMin) : T("entfällt","n/a")]
    ];

    M.auflagen = auflagen();
    M.klaeren = notes.map(function(x){ return {t:x.kurz}; })
      .concat(FESTE_PUNKTE.map(function(p){ return {b:P(p[0]), t:P(p[1])}; }));
    M.notiz = S.notiz.trim().split("\n").map(function(z){ return z.trim(); }).filter(Boolean);
    return M;
  }
