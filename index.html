<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agroforst Überschlagsrechner</title>
<style>
/* Layout: Schrittleiste links, eine Frage-Spalte, Hinweise direkt unter der Frage; stapelt unter 780px.
   Tokens: warmes Papier, Waldtinte, ein frischer Akzent fuer alles Bedienbare, 2 Signalstufen (Hinweis / Achtung). */
:root{
  --paper:#FAF9F6; --surface:#FFFFFF; --tint:#F2F6F3; --sunk:#EFF1EE;
  --ink:#19211C; --ink-2:#47544C; --ink-3:#78847C;
  --line:#DDE3DE; --line-2:#ECEFEC;
  --accent:#1F7A52; --accent-2:#E8F4ED; --accent-ink:#FFFFFF;
  --note:#8A5E0B; --note-bg:#FCF4E3; --note-line:#E0B861;
  --warn:#9E3B2C; --warn-bg:#FBEEEB; --warn-line:#D9907F;
  --role-a:#2E6A4E; --role-b:#1F6085; --role-c:#A24A33; --role-d:#8A6B16; --role-e:#5F4B8B;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --r:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121714; --surface:#1A201C; --tint:#212924; --sunk:#232B26;
    --ink:#E9EEEA; --ink-2:#B5C0B9; --ink-3:#8B968E;
    --line:#2D352F; --line-2:#262D28;
    --accent:#58BC8B; --accent-2:#1C2E25; --accent-ink:#0E1512;
    --note:#E0B262; --note-bg:#2B2416; --note-line:#6B5520;
    --warn:#E8907F; --warn-bg:#2C1C19; --warn-line:#6E3A30;
    --role-a:#6FBF92; --role-b:#6AADD6; --role-c:#E0907A; --role-d:#D3B358; --role-e:#A795D8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121714; --surface:#1A201C; --tint:#212924; --sunk:#232B26;
  --ink:#E9EEEA; --ink-2:#B5C0B9; --ink-3:#8B968E;
  --line:#2D352F; --line-2:#262D28;
  --accent:#58BC8B; --accent-2:#1C2E25; --accent-ink:#0E1512;
  --note:#E0B262; --note-bg:#2B2416; --note-line:#6B5520;
  --warn:#E8907F; --warn-bg:#2C1C19; --warn-line:#6E3A30;
  --role-a:#6FBF92; --role-b:#6AADD6; --role-c:#E0907A; --role-d:#D3B358; --role-e:#A795D8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px;padding-block:22px 44px}

header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:12px}
.brandline{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--serif);font-size:26px;line-height:1.18;margin:5px 0 0;font-weight:400;text-wrap:balance}
.standnote{font-size:11px;color:var(--ink-3);text-align:right;min-width:92px;line-height:1.45}
.lede{font-size:13px;color:var(--ink-2);margin-top:8px;max-width:72ch}

.scope{font-size:12.5px;color:var(--ink-2);margin-top:10px;max-width:84ch;padding:8px 12px;border-left:3px solid var(--accent);
  background:var(--accent-2);border-radius:0 5px 5px 0;line-height:1.45}
.scope b{color:var(--ink);font-weight:650}
.ph{background:var(--note-bg);color:var(--note);border:1px dashed var(--note-line);border-radius:3px;padding:0 4px;font-style:normal}
.jump{font:inherit;font-size:12px;font-weight:650;color:var(--accent);background:none;border:0;padding:0;margin-left:6px;
  cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:4px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:13px;color:var(--ink-2);cursor:pointer;background:var(--surface)}
.seg label+label{border-left:1px solid var(--line)}
.seg input{accent-color:var(--accent);margin:0}
.seg label:has(input:checked){background:var(--accent-2);color:var(--ink);font-weight:650}
.rolle{margin-top:10px}
.divider{margin:24px 0 0;border-top:1px solid var(--line)}
.bar{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:16px 0 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}

.shell{display:grid;grid-template-columns:180px minmax(0,1fr);gap:32px;margin-top:22px;align-items:start}
@media (max-width:780px){.shell{grid-template-columns:minmax(0,1fr);gap:14px}}
.rail{display:flex;flex-direction:column;gap:1px;position:sticky;top:10px}
@media (max-width:780px){.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}}
.railitem{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:5px;background:none;border:0;font:inherit;
  font-size:13px;color:var(--ink-3);text-align:left;cursor:pointer;width:100%;white-space:nowrap}
.railitem:hover{background:var(--tint);color:var(--ink-2)}
.railitem .b{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;
  font-weight:700;border:1px solid var(--line);color:var(--ink-3);background:var(--surface)}
.railitem[aria-current="true"]{color:var(--ink);font-weight:650}
.railitem[aria-current="true"] .b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.railitem[data-seen="1"] .b{border-color:var(--accent);color:var(--accent)}
.railitem[data-seen="1"][aria-current="true"] .b{color:var(--accent-ink)}
.railitem .dot{width:6px;height:6px;border-radius:50%;background:var(--note);margin-left:auto;flex:none}
@media (max-width:780px){.railitem .t{display:none}.railitem{width:auto;padding:6px}.railitem .dot{display:none}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;
  box-shadow:0 1px 2px rgba(0,0,0,.03)}
@media (max-width:440px){.panel{padding:18px 15px}}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h2{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.25;margin:8px 0 0;text-wrap:balance}
.intro{font-size:13.5px;color:var(--ink-2);margin:9px 0 0;max-width:66ch}

fieldset{border:0;padding:0;margin:22px 0 0}
legend{font-size:14.5px;font-weight:650;color:var(--ink);padding:0;margin-bottom:8px;line-height:1.35}
.hint{font-size:12px;color:var(--ink-3);margin:-3px 0 9px;max-width:66ch}
.hint a{color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:5px;
  cursor:pointer;background:var(--surface);font-size:13.5px;color:var(--ink-2);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt input{margin:2px 0 0;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-2);color:var(--ink)}
.opt .sub{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.opt:focus-within{outline:2px solid var(--accent);outline-offset:1px}

.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:5px;font-size:13px;line-height:1.45;
  margin:8px 0 0;border-left:3px solid}
.flag .tag{font-weight:700;flex:none}
.flag.note{background:var(--note-bg);border-color:var(--note-line);color:var(--ink-2)}
.flag.note .tag{color:var(--note)}
.flag.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--ink-2)}
.flag.warn .tag{color:var(--warn)}
.flag ul{margin:4px 0 0;padding-left:17px}
.flag li{margin-bottom:3px}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px;margin-top:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:650;min-width:0}
label.f .u{font-weight:400;color:var(--ink-3)}
input[type=number],input[type=text],select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);
  border-radius:5px;background:var(--surface);color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}

.section-head{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;
  margin:24px 0 2px;padding-top:16px;border-top:1px solid var(--line)}

.rtable{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px;font-variant-numeric:tabular-nums}
.rtable th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;
  padding:0 8px 6px 0;border-bottom:1px solid var(--line)}
.rtable td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.rtable td.n{text-align:right;color:var(--ink);font-weight:650;white-space:nowrap}
.rtable tr.sum td{border-top:1px solid var(--ink);border-bottom:0;color:var(--ink);font-weight:700;padding-top:9px}
.rtable caption{caption-side:top;text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;padding-bottom:4px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:5px 11px;border-radius:99px;border:1px solid}
.chip.ok{color:var(--accent);border-color:var(--accent);background:var(--accent-2)}
.chip.note{color:var(--note);border-color:var(--note-line);background:var(--note-bg)}
.chip.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}

.cut{margin-top:12px;background:var(--tint);border:1px solid var(--line);border-radius:5px;padding:12px 13px}
.cut svg{display:block;width:100%;height:auto;max-width:100%}

/* Ablaufgrafik */
.flowwrap{margin-top:14px}
.flowhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin:14px 0 8px}
.flowhead .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.flowhead .v{font-size:13px;font-weight:650;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:860px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.cards{grid-template-columns:minmax(0,1fr);gap:14px}}
.card{border:1px solid var(--line);border-radius:5px;padding:11px 12px;background:var(--surface);position:relative;min-width:0}
.card .no{position:absolute;top:8px;right:11px;font-size:17px;font-weight:700;color:var(--line)}
.card{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:0;align-content:start;justify-items:start}
@media (max-width:460px){.card{grid-row:auto;grid-template-rows:none}}
.card>.who{align-self:start}
.card h4{font-size:13.5px;margin:0 0 5px;font-weight:650;line-height:1.25}
.card .who{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;padding:3px 8px;border-radius:99px;
  line-height:1.3;margin:0 24px 8px 0}
.card .txt{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.card.here{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.here::after{content:attr(data-here);position:absolute;bottom:-9px;left:11px;font-size:9.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:99px}
.w-a{background:var(--role-a)} .w-b{background:var(--role-b)} .w-c{background:var(--role-c)}
.w-d{background:var(--role-d)} .w-e{background:var(--role-e)}
.flownote{font-size:11.5px;color:var(--ink-3);margin-top:12px;font-style:italic}
.erloes{display:flex;gap:11px;align-items:flex-start;margin-top:12px;padding:11px 13px;border-radius:5px;
  border:1px dashed var(--line);background:var(--tint);font-size:12.5px;color:var(--ink-2)}
.erloes b{color:var(--ink);flex-shrink:0;white-space:nowrap}

ul.plain{list-style:none;margin:10px 0 0;padding:0}
ul.plain li{display:grid;grid-template-columns:auto 1fr;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-2);
  font-size:13px;color:var(--ink-2)}
ul.plain li .mark{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px}
ul.plain li b{color:var(--ink);font-weight:650}

.nav{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
button.btn{font:inherit;font-size:14px;font-weight:650;padding:10px 20px;border-radius:5px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);transition:filter .12s}
button.btn:hover{filter:brightness(1.08)}
button.btn.ghost{background:none;color:var(--ink-2);border-color:var(--line)}
button.btn.ghost:hover{border-color:var(--ink-3);color:var(--ink);filter:none}
button.btn.small{font-size:12.5px;padding:7px 13px}
button.btn:focus-visible,.railitem:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.counter{font-size:12px;color:var(--ink-3)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px}
@media (max-width:440px){.sheet{padding:17px 15px}}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:22px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:154px minmax(0,1fr);gap:5px 14px;font-size:13.5px;margin-top:9px}
@media (max-width:520px){.kv{grid-template-columns:minmax(0,1fr)}.kv dt{margin-top:6px}}
.kv dt{color:var(--ink-3);font-size:12px;padding-top:2px}
.kv dd{margin:0;color:var(--ink-2)}
.sheetfoot{margin-top:20px;padding-top:11px;border-top:1px solid var(--ink);font-size:11px;color:var(--ink-3);line-height:1.55}
.mailbox{margin-top:22px;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;background:var(--surface)}
.mailbox h3{font-family:var(--serif);font-weight:400;font-size:17px;margin:0 0 4px}
.mailtext{margin-top:11px;white-space:pre-wrap;font-size:12.5px;line-height:1.55;color:var(--ink-2);
  background:var(--tint);border:1px solid var(--line);border-radius:5px;padding:13px 14px;max-height:300px;overflow:auto}
footer.pagefoot{margin-top:24px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.55}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
.panel,.sheet{animation:in .22s ease}
@keyframes in{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}

.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.sheetmeta{font-size:11px;color:var(--ink-3);text-align:right;line-height:1.5;white-space:nowrap}
@media (max-width:520px){.sheethead{flex-direction:column;gap:8px}.sheetmeta{text-align:left;white-space:normal}}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
@media (max-width:620px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{border:1px solid var(--line);border-radius:5px;padding:11px 13px;background:var(--tint);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.kpi .v{font-family:var(--serif);font-size:24px;line-height:1.2;color:var(--ink)}
.kpi .s{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.tblwrap{overflow-x:auto}
.rtable th.r,.rtable td.r{text-align:right;white-space:nowrap}
.savebox{margin:0 0 14px}
.savetext{min-width:0}
.sheetfoot p{margin:0 0 6px}
.sheetfoot a,footer.pagefoot a{color:var(--accent)}
footer.pagefoot p{margin:0 0 6px}

@page{size:A4;margin:14mm 16mm}
@media print{
  html,body{background:#fff !important;color:#000}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print{display:none !important}
  .wrap{max-width:none;padding:0}
  .shell{display:block;margin:0}
  .sheet{border:0;padding:0;box-shadow:none;animation:none;background:#fff}
  .sheet h3{break-after:avoid}
  .kv>*,ul.plain li,.rtable tr,.kpi,.flag{break-inside:avoid}
  .kpi{background:#fff}
  .sheetfoot a{color:#1F7A52}
}

/* Update Oktober 2026: Umschalter, Handy-Layout, Maßstab-Zeile */
.top-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.langsw{display:inline-flex;border:1px solid var(--accent);border-radius:99px;overflow:hidden;background:var(--surface)}
.langsw button{font:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;padding:6px 14px;border:0;background:none;color:var(--accent);cursor:pointer;min-width:44px}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.langsw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top>div:first-child{min-width:0}
h1,h2,legend,.opt span,.flag .ftxt,.kv dd,.kv dt,.hint,.intro,ul.plain li span,.kpi,.card,.mailtext,.sheet,.panel,label.f{overflow-wrap:anywhere}
.flag .ftxt{min-width:0}
.flag .tag{max-width:40%}
.kv dt.hl,.kv dd.hl{background:var(--accent-2);color:var(--ink)}
.kv dt.hl{font-weight:700;color:var(--accent);padding:4px 8px;border-radius:4px 0 0 4px}
.kv dd.hl{padding:4px 8px;border-radius:0 4px 4px 0;font-weight:600}
@media (max-width:520px){.kv dt.hl{border-radius:4px 4px 0 0;padding-bottom:0}.kv dd.hl{border-radius:0 0 4px 4px;padding-top:2px}}
.rtable caption{display:table-caption}
.mailtext{overflow-wrap:anywhere}
@media (max-width:560px){
  .wrap:not(.compact) .top-r .standnote{display:none}
  .wrap.compact .standnote{font-size:10.5px;max-width:150px}
  .tblwrap{overflow-x:visible}
  table.rtable.stack,table.rtable.stack tbody,table.rtable.stack tr,table.rtable.stack td{display:block;width:100%}
  table.rtable.stack caption{display:block;width:100%;white-space:normal}
  table.rtable.stack thead{position:absolute;left:-9999px}
  table.rtable.stack tr{border-bottom:1px solid var(--line);padding:6px 0}
  table.rtable.stack td{border:0;padding:2px 0;text-align:left !important;white-space:normal}
  table.rtable.stack td.r::before,table.rtable.stack td[data-l]::before{content:attr(data-l)": ";color:var(--ink-3);font-size:11px}
  table.rtable.stack td:first-child{font-weight:700;color:var(--ink)}
  table.rtable.stack td:first-child::before{content:""}
  table.rtable.stack td.e{display:none}
  .rtable td.n{white-space:normal}
  .nav .btn{flex:1 1 100%}
  .kpi .v{font-size:22px}
}

/* Kopfbereich ab Laptopbreite: grosse Titelzeile, Erlaeuterung und Rechengrundlage nebeneinander */
.verweise{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:flex-start;margin-top:12px}
.verweise details{min-width:0}
.verweise summary,.verweise .vlink{font-size:13px;font-weight:650;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;list-style:none;background:none;border:0;padding:2px 0;font-family:inherit}
.verweise summary::-webkit-details-marker{display:none}
.verweise summary::before{content:"+ ";font-weight:700}
.verweise details[open] summary::before{content:"\2212  "}
.verweise .vbody{font-size:13px;color:var(--ink-2);line-height:1.55;margin-top:6px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-2);border-radius:0 5px 5px 0;max-width:62ch}
.verweise .vbody b{color:var(--ink);font-weight:650}
.wrap.compact .intro-grid{display:none}
.wrap.compact header.top>div:first-child{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 14px}
.wrap.compact h1{font-size:17px;margin:0}
.wrap.compact h1 .tsep{display:inline}
.wrap.compact h1 .tsub{display:inline;font-size:inherit;color:inherit;margin:0}

.verweise{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:14px}
.verweise details{position:static;min-width:0}
.verweise details[open]{flex-basis:100%}
.verweise summary{list-style:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;color:var(--band-ink);
  background:var(--band-soft);border-radius:99px;padding:6px 14px;text-decoration:none}

     ["Anrechenbare Breite und Anforderungen an Anlage und Pflege legt die UNB fest; vorgeschlagen sind 2 bis 5 m je Seite.","The UNB sets the creditable width and the requirements for establishment and care; 2 to 5 m per side are proposed."]],
    [["Bindungsdauer.","Binding period."],
     ["Vorgeschlagen sind 20 Jahre für die Maßnahme und 50 Jahre für Überhälter. Wie die Dauerhaftigkeit bei regelmäßiger Holzernte bewertet wird, ist in der Vollzugspraxis noch nicht einheitlich geklärt.","20 years are proposed for the measure and 50 years for standard trees (Überhälter). How permanence is assessed under regular wood harvest has not yet been settled uniformly in enforcement practice."]]
  ];

  /* ---------------------------------------------------------------- Zustand */
  function leer(){
    return {
      gemeinde:"", lage:"", ziele:[],
      nutzung:"", wertManuell:"", offenland:"", biotop:"", verfuegbar:"", gapdzv:"",
      eigentum:"", dienstleister:"", waerme:"",
      mosaik:false, mehrreihig:false, a2:"keine", arten:false, gewaesser:false,
      eingabe:"flaeche", schlag:5, anzahl:3, laenge:1200, breite:12, saum:2, timeLag:null,
      notiz:""
    };
  }
  var S = leer();
  var step = 0, maxReached = 0, pruefen = false;
  function steps(){ return LANG==="en"
    ? ["Purpose","Site","Responsible body","Scale","Pre-consultation","Result"]
    : ["Anlass","Fläche","Träger","Größenordnung","Vorabstimmung","Ergebnis"]; }

  /* ---------------------------------------------------------------- Zahlen */
  function num(v){ return nf0.format(Math.round(v)); }
  function pc(v){ return num(v) + (LANG==="en" ? "%" : " %"); }
  function rund(v){ var a = Math.abs(v), st = a>=100000 ? 1000 : (a>=5000 ? 100 : 10); return Math.round(v/st)*st; }
  function eur(v){ return LANG==="en" ? "€" + nf0.format(rund(v)) : nf0.format(rund(v)) + " €"; }
  function pEur(v){ return LANG==="en" ? "€" + nf2.format(v) : nf2.format(v) + " €"; }
  function zahl(v){ var n = parseFloat(String(v).replace(",",".")); return isNaN(n) ? 0 : n; }
  function m(v){ return nfk.format(v) + " m"; }

  function richtwert(){ var a = AUSGANG[S.nutzung]; return a ? a.wert : null; }
  function ausgangswert(){
    if(!AUSGANG[S.nutzung]) return null;
    if(String(S.wertManuell).trim()==="") return null;
    var v = zahl(S.wertManuell);
    return (v>=0 && v<=24) ? v : null;
  }
  function eigenerWert(){ var aw = ausgangswert(); return aw!==null && aw!==richtwert(); }
  function achsenPunkte(){
    return (S.mosaik?1:0) + (S.mehrreihig?1:0) + (S.a2==="mittel"?3:(S.a2==="alt"?6:0)) +
           (S.arten?2:0) + (S.gewaesser?1:0);
  }
  function timeLagAuto(){ return S.a2==="alt" ? 1.5 : 1.2; }
  function timeLag(){ return S.timeLag===null ? timeLagAuto() : S.timeLag; }

  function calc(){
    var B = zahl(S.breite), b = zahl(S.saum);
    if(b*2 >= B) b = 0;
    var schlagM2 = zahl(S.schlag)*10000, n = Math.round(zahl(S.anzahl));
    var seite = Math.sqrt(schlagM2);
    var L = S.eingabe==="flaeche" ? n*seite : zahl(S.laenge);
    var fSaum = L * 2 * b;
    var fKern = L * (B - 2*b);
    var fGes  = L * B;
    var deckel = S.gewaesser ? 19 : 18;
    var ziel = Math.min(8 + achsenPunkte(), deckel);
    var tl = timeLag();
    var anrechenbar = ziel / tl;
    var aw = ausgangswert();
    var upKern = aw===null ? null : anrechenbar - aw;
    var upSaum = aw===null ? null : SAUMWERT - aw;
    var pKern = upKern===null ? 0 : fKern * upKern;
    var pSaum = upSaum===null ? 0 : fSaum * upSaum;
    var punkte = pKern + pSaum;
    var ha = fGes/10000;
    var k20 = ha * KOSTEN.voll20;
    var noetigGesamt = k20 / PREIS.mid;
    return {
      L:L, B:B, b:b, kernB:B-2*b, fSaum:fSaum, fKern:fKern, fGes:fGes, ha:ha,
      schlag:schlagM2, n:n, seite:seite,
      anteil: (S.eingabe==="flaeche" && schlagM2>0) ? fGes/schlagM2 : null,
      abstand: (S.eingabe==="flaeche" && n>0) ? seite/n - B : null,
      ziel:ziel, deckel:deckel, tl:tl, anrechenbar:anrechenbar, aw:aw,
      upKern:upKern, upSaum:upSaum, pKern:pKern, pSaum:pSaum, punkte:punkte,
      positiv: aw!==null && punkte>0,
      eMin:punkte*PREIS.min, eMid:punkte*PREIS.mid, eMax:punkte*PREIS.max,
      kAnlage:ha*KOSTEN.anlage, k20:k20,
      deckung: k20>0 ? (punkte*PREIS.mid)/k20 : 0,
      deckungMin: k20>0 ? (punkte*PREIS.min)/k20 : 0,
      deckungMax: k20>0 ? (punkte*PREIS.max)/k20 : 0,
      noetig: fGes>0 ? noetigGesamt/fGes : 0,
      istSchnitt: fGes>0 ? punkte/fGes : 0
    };
  }

  function alleHinweise(){
    var r = [];
    for(var i=0;i<4;i++) hinweise(i).forEach(function(h){ r.push(h); });
    return r;
  }

  /* Fehlende Pflichtangaben je Schritt (Schlüssel = data-need der Frage); das Feld "Lage" ist nie Pflicht */
  function fehlend(i){
    var f = [];
    if(i===0){ if(!S.ziele.length) f.push("ziele"); }
    if(i===1){
      if(!S.nutzung) f.push("nutzung");
      else if(ausgangswert()===null) f.push("wertManuell");
      ["offenland","biotop","verfuegbar","gapdzv"].forEach(function(k){ if(!S[k]) f.push(k); });
    }
    if(i===2) ["eigentum","dienstleister","waerme"].forEach(function(k){ if(!S[k]) f.push(k); });
    if(i===3){
      if(S.eingabe==="flaeche"){
        if(!(zahl(S.schlag)>0)) f.push("schlag");
        if(!(Math.round(zahl(S.anzahl))>0)) f.push("anzahl");
      } else if(!(zahl(S.laenge)>0)) f.push("laenge");
      if(!(zahl(S.breite)>0)) f.push("breite");
    }
    return f;
  }
  function fertig(i){ return fehlend(i).length===0; }
  function markUpdate(){
    var miss = pruefen ? fehlend(step) : [];
    var nodes = document.querySelectorAll("#main [data-need]");
    Array.prototype.forEach.call(nodes, function(n){
      var k = n.getAttribute("data-need"), on = miss.indexOf(k)>=0;
      n.classList.toggle("miss", on);
      var mm = n.querySelector(".missmsg");
      if(mm) mm.textContent = (k==="wertManuell" && String(S.wertManuell).trim()!=="")
        ? T("Bitte einen Ausgangswert zwischen 0 und 24 eintragen","Please enter an initial value between 0 and 24")
        : T("Angabe fehlt","Entry missing");
    });
  }

  /* Rolle: [Bezeichnung, Text, hervorgehoben] */
  function rolle(){
    var r = [];
    var sich = {
      kommune:T("Die Kommune kann das Ökokonto führen und die Maßnahme rechtlich sichern.","The municipality can run the eco-account (Ökokonto) and legally secure the measure."),
      betrieb:T("Der Betrieb sichert die Maßnahme und trägt Verfahren und Vorfinanzierung.","The farm secures the measure and bears the procedure and pre-financing."),

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function el(tag, attrs, html){
    var n = document.createElement(tag);
    if(attrs) for(var k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined) n.setAttribute(k, attrs[k]); }
    if(html!==undefined) n.innerHTML = html;
    return n;

  function radios(name, legend, hint, options, current, cols){

  function fq(i,keys){ return flagsFor(hinweise(i).filter(function(x){ return keys.indexOf(x.q)>=0; })); }
  function flagsFor(list){
    return list.map(function(h){
      return '<div class="flag '+h.art+'"><span class="tag">'+(h.art==="warn"?T("Achtung","Warning"):T("Hinweis","Note"))+'</span><span class="ftxt">'+h.text+'</span></div>';

  function schrittName(i){ return T("Schritt ","Step ")+(i+1)+" "+steps()[i]; }
  var YN = function(){ return [{v:"nein",l:T("nein","no")},{v:"ja",l:T("ja","yes")}]; };

  function querschnitt(c){
    if(!(c.B>0)) return "";
    var W = 520, H = 92, pad = 26, inner = W - 2*pad;
    var sb = c.B>0 ? (c.b / c.B) * inner : 0;
    var kern = inner - 2*sb;
    var y = 26, hgt = 34;
    function t(x,yy,txt,anchor,size,col){
      return '<text x="'+x+'" y="'+yy+'" text-anchor="'+(anchor||"middle")+'" font-size="'+(size||10)+
             '" fill="'+(col||"currentColor")+'" font-family="inherit">'+txt+'</text>';
    }
    var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+T("Querschnitt des Gehölzstreifens","Cross-section of the woody strip")+'" style="color:var(--ink-3)">';
    s += '<rect x="'+pad+'" y="'+y+'" width="'+sb+'" height="'+hgt+'" fill="var(--note-bg)" stroke="var(--note-line)"/>';
    s += '<rect x="'+(pad+sb)+'" y="'+y+'" width="'+kern+'" height="'+hgt+'" fill="var(--accent-2)" stroke="var(--accent)"/>';
    s += '<rect x="'+(pad+sb+kern)+'" y="'+y+'" width="'+sb+'" height="'+hgt+'" fill="var(--note-bg)" stroke="var(--note-line)"/>';
    s += t(pad+sb+kern/2, y+hgt/2+4, T("Kern "+nf1.format(c.kernB)+" m, Außenreihe zu Außenreihe","Core "+nf1.format(c.kernB)+" m, outer row to outer row"), "middle", 11, "var(--ink)");
    if(c.b>0){
      s += t(pad+sb/2, y-7, nf1.format(c.b)+" m", "middle", 10);
      s += t(pad+sb+kern+sb/2, y-7, nf1.format(c.b)+" m", "middle", 10);
      s += t(pad+sb/2, y+hgt+14, T("Saum","Margin"), "middle", 10);
      s += t(pad+sb+kern+sb/2, y+hgt+14, T("Saum","Margin"), "middle", 10);
    }
    s += '<line x1="'+pad+'" y1="'+(y+hgt+26)+'" x2="'+(W-pad)+'" y2="'+(y+hgt+26)+'" stroke="currentColor" stroke-width="1"/>';
    s += t(W/2, y+hgt+22, T("Breite des Gehölzstreifens "+nf1.format(c.B)+" m","Width of the woody strip "+nf1.format(c.B)+" m"), "middle", 10);
    s += '</svg>';
    return s;
  }

          [[1,T("1,0 · unter 5 Jahre","1.0 · under 5 years")],[1.2,T("1,2 · 5 bis 10 Jahre","1.2 · 5 to 10 years")],[1.5,T("1,5 · 10 bis 30 Jahre","1.5 · 10 to 30 years")],[2,T("2,0 · über 30 Jahre","2.0 · over 30 years")]]
          .map(function(o){ return '<option value="'+o[0]+'"'+(timeLag()===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("")+
        '</select></label>'+
        '</div>';
      h += '<div class="hint" style="margin-top:9px">'+
        T("Der Faktor gibt an, wie lange die Gehölze bis zum Zielzustand brauchen: 1,0 bei unter 5 Jahren, 1,2 bei 5 bis 10, 1,5 bei 10 bis 30 und 2,0 bei über 30 Jahren. Der Zielwert wird durch den Faktor geteilt; je länger die Entwicklung dauert, desto weniger Punkte sind anrechenbar. Vorbelegt ist 1,2, mit Überhältern 1,5; Sie können den Faktor überschreiben.",
          "The factor states how long the woody plants need to reach the target condition: 1.0 for under 5 years, 1.2 for 5 to 10, 1.5 for 10 to 30 and 2.0 for over 30 years. The target value is divided by the factor; the longer the development takes, the fewer points are creditable. The preset is 1.2, or 1.5 with standard trees; you can overwrite the factor.")+'</div>';
      h += '<div id="calcOut">'+calcOutHTML()+'</div>';
    }

    if(i===4){
      h += '<div class="eyebrow">'+of5+'</div><h2>'+T("Womit Sie in die Vorabstimmung gehen","What you take into the pre-consultation")+'</h2>'+
           '<p class="intro">'+T("So geht es nach der Vorprüfung weiter. Im nächsten Schritt erhalten Sie Ihre Ergebnisse und Dokumente zum Herunterladen.",
             "This is how things continue after the pre-check. In the next step you receive your results and documents to download.")+'</p>';
      h += '<div class="section-head">'+T("Der Weg im Überblick","The process at a glance")+'</div>';
      h += '<div class="flowwrap">';
      h += '<div class="flowhead"><span class="k">'+T("Phase 1 bis 4","Phases 1 to 4")+'</span><span class="v">'+T("Vorbereiten, abstimmen, planen, sichern","Prepare, consult, plan, secure")+'</span></div>';
      h += '<div class="cards">' + ABLAUF.slice(0,4).map(karte).join("") + '</div>';
      h += '<div class="flowhead"><span class="k">'+T("Phase 5 bis 8","Phases 5 to 8")+'</span><span class="v">'+T("Anerkennen, pflanzen, nachweisen, erhalten","Recognise, plant, document, maintain")+'</span></div>';
      h += '<div class="cards">' + ABLAUF.slice(4).map(karte).join("") + '</div>';
      h += '<div class="flownote">'+T("Die Phasen 1 bis 3 sind eine Abstimmungsschleife, keine Einbahnstraße.","Phases 1 to 3 form a feedback loop, not a one-way street.")+'</div>';
      h += '<div class="erloes"><b>'+T("Erlös","Revenue")+'</b><span>'+T("Nicht an die Reihenfolge gebunden. Er entsteht mit der Zuordnung zu einem Eingriff, nicht mit der Pflanzung, und steht dem Berechtigten der Wertpunkte zu.",
        "Not tied to the sequence. It arises when the value points are assigned to an intervention, not with the planting, and belongs to whoever holds the entitlement to the value points.")+'</span></div>';
      h += '</div>';

      h += '<fieldset><legend>'+T("Eigene Punkte","Your own points")+'</legend><div class="hint">'+T("Erscheinen auf dem Ergebnisblatt.","Appear on the result sheet.")+'</div>'+
           '<textarea id="notiz" placeholder="'+esc(T("Was Sie außerdem ansprechen wollen","Anything else you want to raise"))+'">'+esc(S.notiz)+'</textarea></fieldset>';
    }
    return h;
  }

  function kostenText(){
    return T("Die Kosten stammen von einem einzelnen Standort, dem Agroforstsystem Gonbach am Hofgut Neumühle (Donnersbergkreis), das das Institut für angewandtes Stoffstrommanagement (IfaS) als Forschungsvorhaben geplant, umgesetzt und beforscht hat. Gepflanzt 2025: rund 2,0 ha Gehölzfläche in 6 Streifen mit rund 1.600 Gehölzen je Hektar Gehölzfläche, überwiegend Hybridpappeln, dazu Wert- und Fruchthölzer, darunter 7 heimische Arten. Eingerechnet sind Pflanzgut, Baumschutz sowie Arbeit und Maschinen für Anlage und Pflege im ersten Standjahr (rund 9.000 € je Hektar, netto) und für die Mindeststandzeit von 20 Jahren zusätzlich 3 Ernten und die Rekultivierung (zusammen rund 28.000 € je Hektar). Nicht eingerechnet sind Planung und fachliche Begleitung, Kartierung, Eintragung und rechtliche Sicherung, Entwicklungsnachweise, Vermarktung und der entgangene Deckungsbeitrag der Fläche. Die Anlage ist keine anerkannte Kompensationsmaßnahme. Für eine Kompensationsmaßnahme liegen die Kosten wegen dieser Verfahrensschritte voraussichtlich höher. Die Werte ersetzen keine eigene Kalkulation.",
      "The costs come from a single site, the Gonbach agroforestry system at Hofgut Neumühle (Donnersbergkreis), which the Institute for Applied Material Flow Management (IfaS) planned, implemented and studied as a research project. Planted in 2025: about 2.0 ha of woody area in 6 strips with about 1,600 woody plants per hectare of woody area, mainly hybrid poplars, plus valuable and fruit trees, including 7 native species. Included are planting stock, tree protection, and labour and machinery for establishment and care in the first year (about €9,000 per hectare, net) and, for the minimum standing time of 20 years, an additional 3 harvests and the restoration (together about €28,000 per hectare). Not included are planning and professional supervision, mapping, registration and legal securing, development proofs, marketing and the lost contribution margin of the land. The plantation is not a recognised compensation measure. For a compensation measure the costs are likely to be higher because of these procedural steps. The values do not replace your own calculation.");
  }
  function kostenKasten(){ return '<div class="costbox"><b>'+T("Zur Kostenannahme","On the cost assumption")+'</b>'+esc(kostenText())+'</div>'; }

             'Rough estimate: the field is assumed to be roughly square, with the strips running along its full length. This gives about '+num(c.seite)+' m per strip, '+num(c.L)+' m in total. For elongated fields with strips along the long side the length is larger; if you know it, calculating with the total length is more accurate.')+'</div>';

      '</table></div>';
    o += '<div class="tblwrap"><table class="rtable"><caption>'+T("Erlös und Kosten, Beträge gerundet","Revenue and costs, amounts rounded")+'</caption>'+
      '<tr><th></th><th>'+T("Bezug","Basis")+'</th><th style="text-align:right">'+T("Betrag","Amount")+'</th></tr>';

      o += '<tr><td>'+T("Erlös bei "+pEur(0.5)+" je Punkt","Revenue at "+pEur(0.5)+" per point")+'</td><td></td><td class="n">'+eur(c.eMin)+'</td></tr>'+
           '<tr><td>'+T("Erlös bei "+pEur(1.5)+" je Punkt","Revenue at "+pEur(1.5)+" per point")+'</td><td>'+T("mittlerer angenommener Marktwert","mid assumed market value")+'</td><td class="n">'+eur(c.eMid)+'</td></tr>'+
           '<tr><td>'+T("Erlös bei "+pEur(3)+" je Punkt","Revenue at "+pEur(3)+" per point")+'</td><td></td><td class="n">'+eur(c.eMax)+'</td></tr>';

      o += '<tr><td>'+T("Erlös aus Wertpunkten","Revenue from value points")+'</td><td>'+T("keine Aufwertung","no uplift")+'</td><td class="n">'+T("entfällt","n/a")+'</td></tr>';

  /* ---------------------------------------------------------------- Mailentwurf (5.5) */
  function mailText(){
    var B = basis(), c = B.c, t = "";

    var nutz = {acker:T("Die Fläche wird derzeit als Acker genutzt.","The site is currently used as arable land."),
                gruenGering:T("Die Fläche ist derzeit intensiv genutztes Grünland.","The site is currently intensively used grassland."),
                gruenHoch:T("Die Fläche ist derzeit artenreiches Grünland.","The site is currently species-rich grassland."),
                dauer:T("Auf der Fläche steht derzeit eine Dauerkultur.","There is currently a permanent crop on the site.")}[S.nutzung]

    t += T("Betreff: Vorabstimmung: Agroforstsystem als produktionsintegrierte Kompensation","Subject: Pre-consultation: agroforestry system as production-integrated compensation")+"\n\n";
    t += T("Sehr geehrte Damen und Herren,\n\n","Dear Sir or Madam,\n\n");
    t += T("wir prüfen, ob auf einer Fläche ("+lage+") ein Agroforstsystem als produktionsintegrierte Kompensationsmaßnahme umgesetzt werden kann, und möchten das Vorhaben frühzeitig und unverbindlich mit Ihnen abstimmen.\n\n",
           "we are examining whether an agroforestry system can be implemented as a production-integrated compensation measure on a site ("+lage+"), and would like to discuss the project with you early and without obligation.\n\n");

           "As the biotope value list contains no biotope type for agroforestry systems, we propose an assessment by analogy with hedges and tree rows. A method paper discloses the derivation and the nature conservation background; it is available together with the rough-estimate calculator “Agroforestry as a compensation measure” at "+LINK_WERKZEUG+".\n\n");
    var off = S.offenland==="ja", bio = S.biotop==="ja";

             "The site lies in an open-country or resting-bird area and touches a legally protected biotope; how woody plants can be reconciled with the protection purpose there and how the measure can take the biotope into account, we would like to agree with you.");
    else if(off)
      t += T("Die Fläche liegt in einem Offenland- oder Rastvogelgebiet; ob und in welcher Form Gehölze dort mit dem Schutzzweck in Einklang zu bringen sind, würden wir gern mit Ihnen abstimmen.",
             "The site lies in an open-country or resting-bird area; whether and in what form woody plants can be reconciled with the protection purpose there, we would like to agree with you.");
    else if(bio)
      t += T("Auf der Fläche liegt ein gesetzlich geschütztes Biotop; wie die Maßnahme darauf Rücksicht nehmen kann, würden wir gern mit Ihnen abstimmen.",

    if(off || bio) t += "\n\n";
    if(S.verfuegbar==="nein")
      t += T("Die Fläche ist voraussichtlich nicht über den gesamten Zeitraum des Eingriffs verfügbar; einen späteren Flächenwechsel würden wir gern von vornherein mit Ihnen regeln.\n\n",
             "The site is probably not available for the entire period of the intervention; we would like to agree a later change of site with you from the outset.\n\n");
    t += T("Gerne möchten wir die Maßnahme gemeinsam mit Ihnen so ausgestalten, dass sie an diesem Standort möglichst viel für Natur und Landschaft leistet. Über einen Austausch, gern bei einem gemeinsamen Termin auf der Fläche, freuen wir uns. Flächendetails und eine erste Vorabberechnung stellen wir Ihnen bei Interesse gern zur Verfügung.\n\n",
           "We would like to design the measure together with you so that it does as much as possible for nature and landscape at this site. We look forward to an exchange, preferably at a joint meeting on the site. We will gladly provide site details and a first preliminary calculation if you are interested.\n\n");
    t += T("Mit freundlichen Grüßen\n\n[Name, Kommune]\n","Kind regards\n\n[Name, municipality]\n");
    return t;
  }

  /* ---------------------------------------------------------------- Datenmodell (5.1) */
  function basis(){
    var c = calc(), hs = alleHinweise(), aw = c.aw;
    var gem = S.gemeinde.trim();
    return {
      c:c, hs:hs, aw:aw, pos:c.positiv,
      warns:hs.filter(function(x){ return x.art==="warn"; }),
      notes:hs.filter(function(x){ return x.art==="note"; }),
      gem:gem, titel:(gem || T("Agroforst-Kompensationsmaßnahme","Agroforestry compensation measure")),
      lage:S.lage.trim(), datum:heute(),
      keineAufwertung:(aw!==null && !c.positiv),
      kernUnter:(aw!==null && c.punkte>0 && c.upKern<0),
      notiz:S.notiz.trim().split("\n").map(function(z){ return z.trim(); }).filter(Boolean)
    };
  }

  function hinweisGruppen(hs){
    var titel = {flaeche:T("Fläche und Bewertung","Site and assessment"), umsetzung:T("Umsetzung und Träger","Implementation and responsible body"), finanzierung:T("Finanzierung","Financing")};
    var g = {flaeche:[], umsetzung:[], finanzierung:[]};
    hs.forEach(function(h){
      if(h.art!=="note" || !g[h.gruppe]) return;
      var l = h.lang || h.text, hit = g[h.gruppe].filter(function(e){ return e.b===h.stichwort; })[0];
      if(hit) hit.t += " " + l; else g[h.gruppe].push({b:h.stichwort, t:l});
    });
    g.finanzierung.push({b:T("Öko-Regelung 3 und Kompensation.","Eco-Scheme 3 and compensation."),
      t:T("Ob neben der Kompensation zusätzlich die Förderung über die Öko-Regelung 3 möglich ist, ist derzeit offen.","Whether the Eco-Scheme 3 subsidy can be claimed in addition to compensation is currently open.")});
    return ["flaeche","umsetzung","finanzierung"].map(function(k){ return {titel:titel[k], punkte:g[k]}; }).filter(function(x){ return x.punkte.length; });
  }

  function herleitung(c){
    var tei = [T("8 Basisausprägung","8 baseline")];
    if(S.mosaik) tei.push(T("1 Nutzungsmosaik","1 harvest mosaic"));
    if(S.mehrreihig) tei.push(T("1 Mehrreihigkeit","1 multi-row planting"));
    if(S.a2==="mittel") tei.push(T("3 Ernteintervall ab 10 Jahren","3 harvest interval from 10 years"));
    if(S.a2==="alt") tei.push(T("6 Überhälter","6 standard trees"));
    if(S.arten) tei.push(T("2 Artenvielfalt","2 species diversity"));
    if(S.gewaesser) tei.push(T("1 Gewässerlage","1 watercourse location"));
    return {tei:tei, capped:(8+achsenPunkte())>c.deckel};
  }

  function modellIntern(){
    var M = basis(), c = M.c, aw = M.aw, pos = M.pos;
    var zielText = {klima:T("Klimaschutz und Klimaanpassung","climate protection and adaptation"), waerme:T("Wärme und regionale Wertschöpfung","heat and regional value creation"),
      kompensation:T("eigener Kompensationsbedarf","own compensation need"), rohstoff:T("Rohstoffe und lokale Wirtschaft","raw materials and local economy")};
    var warns = M.warns;

  /* gemeinsame Zeichenhilfen: para, runs, heading, kv, bullets, chip, kpis, table, tableG, Seitenfuß */
  function pdfKit(){
    var J = window.jspdf && window.jspdf.jsPDF;
    if(!J) return null;
    var doc = new J({unit:"mm", format:"a4", orientation:"portrait", compress:true});
    var PW=210, PH=297, ML=18, MT=18, MB=22, CW=174, PT=0.3528, y=MT, mono=false;
    var K = {ink:[25,33,28], ink2:[71,84,76], ink3:[120,132,124], line:[221,227,222], acc:[31,122,82], accBg:[232,244,237],
             warn:[158,59,44], warnBg:[251,238,235], tint:[242,246,243]};
    function cl(s){ return String(s).replace(/[  ]/g," ").replace(/−/g,"-").replace(/[„“”]/g,'"').replace(/·/g,"-"); }
    function tc(a){ doc.setTextColor(a[0],a[1],a[2]); }
    function fc(a){ doc.setFillColor(a[0],a[1],a[2]); }
    function dc(a){ doc.setDrawColor(a[0],a[1],a[2]); }
    function ft(face,style,size){ doc.setFont(face,style); doc.setFontSize(size); }
    function stp(size,k){ return size*PT*(k||1.4); }
    function need(h){ if(y+h > PH-MB){ doc.addPage(); y = MT; } }
    function base(size){ return size*PT*0.85; }

    function para(t,size,colr,x,w,style,k){
      ft("helvetica",style||"normal",size);
      var ls = doc.splitTextToSize(cl(t), w), st = stp(size,k);
      ls.forEach(function(l){
        need(st); ft("helvetica",style||"normal",size); tc(colr);
        doc.text(l, x, y+base(size)); y += st;
      });
    }
    function runs(rs,x,w,size,colr,k){
      var st = stp(size,k), toks = [], sp = false;
      rs.forEach(function(r){
        cl(r.t).split(" ").forEach(function(p,j){
          if(p===""){ sp = true; return; }
          toks.push({t:p, r:r, sp: sp || j>0});
          sp = false;
        });
      });
      function sty(r){ return r.b ? (r.i?"bolditalic":"bold") : (r.i?"italic":"normal"); }
      var lines = [[]], cx = 0;
      toks.forEach(function(t){
        ft("helvetica", sty(t.r), size);
        var tw = doc.getTextWidth(t.t), spw = doc.getTextWidth(" ");
        var add = (cx>0 && t.sp) ? spw : 0;
        if(cx>0 && cx+add+tw > w){ lines.push([]); cx = 0; add = 0; }
        lines[lines.length-1].push({t:t.t, r:t.r, x:cx+add, w:tw});
        cx += add+tw;
      });
      lines.forEach(function(ln){
        need(st);
        ln.forEach(function(wd){
          ft("helvetica", sty(wd.r), size);
          var lc = mono ? K.ink : K.acc;
          tc(wd.r.u ? lc : colr);
          var b = y+base(size);
          doc.text(wd.t, x+wd.x, b);
          if(wd.r.u){
            dc(lc); doc.setLineWidth(0.15);
            doc.line(x+wd.x, b+0.5, x+wd.x+wd.w, b+0.5);
            doc.link(x+wd.x, y, wd.w, st, {url:wd.r.u.indexOf("http")===0 ? wd.r.u : LINK_WERKZEUG+wd.r.u});
          }
        });
        y += st;
      });
    }
    function heading(t){
      need(24); y += 5;
      if(mono){ ft("helvetica","bold",10.5); tc(K.ink); doc.text(cl(t), ML, y+4.2); }
      else { ft("times","normal",13); tc(K.ink); doc.text(cl(t), ML, y+4.2); }
      y += 6.4; dc(K.line); doc.setLineWidth(0.2); doc.line(ML, y, ML+CW, y); y += 2.6;
    }
    function kv(l,t,bold){
      var size = 9.5, st = stp(size,1.4);
      ft("helvetica",bold?"bold":"normal",size);
      var ls = doc.splitTextToSize(cl(t), CW-47);
      need(ls.length*st+1.5);
      ft("helvetica",bold?"bold":"normal",8.5); tc(bold&&!mono?K.acc:K.ink3); doc.text(cl(l), ML, y+base(size));
      ft("helvetica",bold?"bold":"normal",size); tc(bold?K.ink:K.ink2);
      ls.forEach(function(s,i){ doc.text(s, ML+47, y+base(size)+i*st); });
      y += ls.length*st+1.5;
    }
    function bullets(items){
      items.forEach(function(it){
        need(stp(9.5,1.4)*2);
        fc(mono?K.ink2:K.acc); doc.circle(ML+1.1, y+2.1, 0.55, "F");
        var rs = it.b ? [{t:it.b+" ", b:true},{t:it.t}] : [{t:it.t}];
        runs(rs, ML+5, CW-5, 9.5, K.ink2, 1.4);
        y += 1.3;
      });
    }
    function chip(t,kind){
      ft("helvetica","bold",8.5);
      var tw = doc.getTextWidth(cl(t))+7, h = 6.4;
      need(h+3);
      var fcol = kind==="warn" ? K.warnBg : K.accBg, ccol = kind==="warn" ? K.warn : K.acc;
      fc(fcol); dc(ccol); doc.setLineWidth(0.25); doc.roundedRect(ML, y, tw, h, 3.2, 3.2, "FD");
      tc(ccol); doc.text(cl(t), ML+3.5, y+4.3); y += h+3;
    }
    function kpis(list){
      var gap = 3, w = (CW-2*gap)/3, h = 25;
      need(h+3);
      list.forEach(function(k,i){
        var x = ML+i*(w+gap);
        fc(K.tint); dc(K.line); doc.setLineWidth(0.25); doc.roundedRect(x, y, w, h, 1.5, 1.5, "FD");
        ft("helvetica","bold",6.5); tc(K.ink3); doc.text(cl(k.k).toUpperCase(), x+3.5, y+5);
        ft("times","normal",17); tc(K.ink); doc.text(cl(k.v), x+3.5, y+13.5);
        ft("helvetica","normal",7.6); tc(K.ink3);
        doc.splitTextToSize(cl(k.s), w-7).slice(0,3).forEach(function(l,j){ doc.text(l, x+3.5, y+18.2+j*3.1); });
      });
      y += h+3;
    }
    function table(head, rows, sum, widths){
      function rowH(row, size, style){
        var n = Math.max.apply(null, row.map(function(t,i){ ft("helvetica",style,size); return doc.splitTextToSize(cl(t), widths[i]-2.5).length; }));
        return n*stp(size,1.3)+2.6;
      }
      function cell(row, size, style, colr, lineTop){
        var ls = row.map(function(t,i){ ft("helvetica",style,size); return doc.splitTextToSize(cl(t), widths[i]-2.5); });
        var n = Math.max.apply(null, ls.map(function(a){ return a.length; }));
        var h = n*stp(size,1.3)+2.6;
        need(h);
        if(lineTop){ dc(K.ink); doc.setLineWidth(0.3); doc.line(ML, y, ML+CW, y); }
        var x = ML;
        ls.forEach(function(a,i){
          ft("helvetica",style,size); tc(colr);
          a.forEach(function(l,k){
            var ty = y+1.3+base(size)+k*stp(size,1.3);
            if(i===0) doc.text(l, x, ty); else doc.text(l, x+widths[i]-1.2, ty, {align:"right"});
          });
          x += widths[i];
        });
        y += h;
        if(!lineTop){ dc(K.line); doc.setLineWidth(0.2); doc.line(ML, y, ML+CW, y); }
      }
      var hd = head.map(function(t){ return cl(t).toUpperCase(); });
      var tot = rowH(hd, 7, "bold") + rowH(sum, 9.6, "bold") + 2;
      rows.forEach(function(r){ tot += rowH(r, 9.2, "normal"); });
      need(tot);
      cell(hd, 7, "bold", K.ink3, false);
      rows.forEach(function(r){ cell(r, 9.2, "normal", K.ink2, false); });
      cell(sum, 9.6, "bold", K.ink, true);
      y += 2;
    }
    /* Haarlinientabelle ohne Summenzeile; al je Spalte "l" oder "r" */
    function tableG(head, rows, widths, al, size){
      size = size || 8;
      var hd = head.map(function(t){ return cl(t).toUpperCase(); });
      function kopf(){ dc(K.ink2); doc.setLineWidth(0.3); doc.line(ML, y, ML+CW, y); cell(hd, 6.8, "bold", K.ink3, true); }
      function cell(row, sz, style, colr, istKopf){
        var ls = row.map(function(t,i){ ft("helvetica",style,sz); return doc.splitTextToSize(cl(t), widths[i]-2.5); });
        var n = Math.max.apply(null, ls.map(function(a){ return a.length; }));
        var h = n*stp(sz,1.3)+2.6;
        if(!istKopf && y+h > PH-MB){ doc.addPage(); y = MT; kopf(); }
        var x = ML;
        ls.forEach(function(a,i){
          ft("helvetica",style,sz); tc(colr);
          a.forEach(function(l,k){
            var ty = y+1.3+base(sz)+k*stp(sz,1.3);
            if(al[i]==="r") doc.text(l, x+widths[i]-1.2, ty, {align:"right"}); else doc.text(l, x+(i===0?0:1), ty);
          });
          x += widths[i];
        });
        y += h; dc(K.line); doc.setLineWidth(0.2); doc.line(ML, y, ML+CW, y);
      }
      need(32);
      kopf();
      rows.forEach(function(r){ cell(r, size, "normal", K.ink2, false); });
      y += 2;
    }
    function fuss(linksText, rechtsText){
      var n = doc.getNumberOfPages();
      for(var i=1;i<=n;i++){
        doc.setPage(i);
        dc(K.line); doc.setLineWidth(0.2); doc.line(ML, PH-14, ML+CW, PH-14);
        ft("helvetica","normal",8); tc(K.ink3);
        doc.text(cl(linksText), ML, PH-10.5);
        doc.text(T("Seite ","Page ")+i+T(" von "," of ")+n, PW-ML, PH-10.5, {align:"right"});
      }
    }
    function paraH(t,size,w,style,k){ ft("helvetica",style||"normal",size); return doc.splitTextToSize(cl(t), w).length*stp(size,k||1.4); }
    function bulletsH(items){
      var h = 0;
      items.forEach(function(it){ ft("helvetica","normal",9.5); h += doc.splitTextToSize(cl((it.b?it.b+" ":"")+it.t), CW-6).length*stp(9.5,1.4)+1.3; });
      return h;
    }
    return {paraH:paraH, bulletsH:bulletsH, doc:doc, K:K, PW:PW, PH:PH, ML:ML, CW:CW, cl:cl, tc:tc, fc:fc, dc:dc, ft:ft, stp:stp, base:base, need:need,
            para:para, runs:runs, heading:heading, kv:kv, bullets:bullets, chip:chip, kpis:kpis, table:table, tableG:tableG, seitenfuss:fuss,
            getY:function(){ return y; }, setY:function(v){ y = v; }, skip:function(d){ y += d; }, setMono:function(v){ mono = v; }};
  }

  function pdfIntern(){
    var k = pdfKit(); if(!k) return null;
    var M = modellIntern(), doc = k.doc, K = k.K, ML = k.ML, CW = k.CW, PW = k.PW, cl = k.cl;

    k.ft("helvetica","bold",7.5); k.tc(K.acc);
    doc.text(cl(T("Ergebnisblatt der Überschlagsrechnung","Result sheet of the rough-estimate calculation")).toUpperCase(), ML, k.getY()+2.2);
    k.ft("helvetica","normal",8); k.tc(K.ink3);
    var y0 = k.getY();
    var meta = doc.splitTextToSize(cl(T("Rheinland-Pfalz, Stand Oktober 2026, erstellt am ","Rhineland-Palatinate, version October 2026, created on ")+M.datum), 80);
    meta.forEach(function(t,i){ doc.text(t, PW-ML, y0+2.2+i*3.8, {align:"right"}); });
    k.ft("helvetica","bold",8); k.tc(K.ink2);
    doc.text(cl(T("internes Dokument","internal document")), PW-ML, y0+2.2+meta.length*3.8+1.8, {align:"right"});
    k.setY(y0 + 2.2 + (meta.length+1)*3.8 + 4);
    var tsz = 20; k.ft("times","normal",tsz);
    var wmax = Math.max.apply(null, cl(M.titel).split(" ").map(function(w){ return doc.getTextWidth(w); }));
    while(wmax > CW && tsz > 12){ tsz -= 1; k.ft("times","normal",tsz); wmax = Math.max.apply(null, cl(M.titel).split(" ").map(function(w){ return doc.getTextWidth(w); })); }
    k.tc(K.ink);
    doc.splitTextToSize(cl(M.titel), CW).forEach(function(l){ doc.text(l, ML, k.getY()+k.base(tsz)); k.skip(k.stp(tsz,1.2)); });
    k.ft("helvetica","normal",9); k.tc(K.ink3);
    doc.text(cl(T("Wertpunkte, Erlös und Kosten aus Ihren Angaben","Value points, revenue and costs from your entries")), ML, k.getY()+k.base(9)); k.skip(6);
    k.chip(M.chip.t, M.chip.k);
    M.warns.forEach(function(x){
      k.para(T("Achtung, ","Warning, ")+schrittName(x.schritt)+": "+x.kurz, 9.5, K.warn, ML, CW, "normal", 1.4);
    });
    k.skip(2);
    k.kpis(M.kpis);
    if(M.low) k.para(M.low, 9, K.ink3, ML, CW, "normal", 1.4);

    k.heading(T("Angenommene Konstellation","Assumed constellation"));
    k.para(T("Angaben aus dem Durchlauf. Sie sind Annahmen des Überschlags, keine Zusagen.","Entries from the run-through. They are assumptions of the rough estimate, not commitments."), 9, K.ink3, ML, CW, "normal", 1.4);
    k.skip(1.5);
    M.konst.forEach(function(r){ k.kv(r[0], r[1], r[2]); });

    k.heading(T("Rechnerischer Überschlag","Calculated estimate"));
    M.herl.forEach(function(r){ k.kv(r[0], r[1]); });
    k.skip(2);
    k.table(M.tabKopf, M.tab, M.tabSumme, [40,26,28,26,28,26]);
    k.para(T("Werte gerundet. Die Wertpunkte ergeben sich aus Fläche mal Aufwertung je m².","Values rounded. The value points result from area times uplift per m²."), 8.5, K.ink3, ML, CW, "normal", 1.4);
    k.skip(2);
    M.geld.forEach(function(r){ k.kv(r[0], r[1]); });
    k.skip(2);
    k.need(k.paraH("x", 9.5, CW, "bold") + k.paraH(kostenText(), 8.5, CW, "normal", 1.45) + 2);
    k.para(T("Zur Kostenannahme","On the cost assumption"), 9.5, K.ink, ML, CW, "bold", 1.4);
    k.para(kostenText(), 8.5, K.ink2, ML, CW, "normal", 1.45);

    k.heading(T("Hinweise aus Ihren Angaben","Notes from your entries"));
    M.gruppen.forEach(function(g){
      k.need(k.paraH(g.titel, 9.5, CW, "bold", 1.6) + 0.8 + k.bulletsH(g.punkte) + 2);
      k.para(g.titel, 9.5, K.ink, ML, CW, "bold", 1.6);
      k.skip(0.8);
      k.bullets(g.punkte);
      k.skip(1);
    });

    k.heading(T("Was im Pflanzplan festgeschrieben werden muss","What must be fixed in the planting plan"));
    k.bullets(M.auflagen.map(function(a){ return {t:a}; }));

    k.need(16 + k.bulletsH(M.klaeren));
    k.heading(T("Was sich erst im Gespräch mit der UNB klärt","What is only settled in the conversation with the UNB"));
    k.bullets(M.klaeren);

    if(M.notiz.length){
      k.heading(T("Anmerkungen der Kommune","Notes from the municipality"));
      k.bullets(M.notiz.map(function(z){ return {t:z}; }));
    }

    k.need(46); k.skip(6);
    k.dc(K.ink); doc.setLineWidth(0.3); doc.line(ML, k.getY(), ML+CW, k.getY()); k.skip(3.2);
    fuss().forEach(function(p,i){ k.runs(p, ML, CW, 7.9, K.ink3, 1.45); k.skip(1.6); });

    k.seitenfuss(T("Ergebnisblatt der Überschlagsrechnung, internes Dokument","Result sheet of the rough-estimate calculation, internal document"));
    return doc;
  }

  function pdfSkizze(){
    var k = pdfKit(); if(!k) return null;
    k.setMono(true);
    var M = modellSkizze(), Z = M.Z, doc = k.doc, K = k.K, ML = k.ML, CW = k.CW, PW = k.PW, cl = k.cl;

    var titel = cl(T("Maßnahmenskizze zur Vorabstimmung mit der unteren Naturschutzbehörde","Measure sketch for pre-consultation with the lower nature conservation authority"));
    var intro = T("Vorläufige Angaben aus einer überschlägigen Vorprüfung als Grundlage für ein erstes Gespräch. Die Skizze ist keine Antragsunterlage und ersetzt keine gutachterliche Bilanzierung.","Provisional information from a rough preliminary check as a basis for a first conversation. The sketch is not an application document and does not replace an expert assessment.");
    var top = k.getY() - 6, IN = 4;
    k.ft("helvetica","bold",13);
    var tz = doc.splitTextToSize(titel, CW-2*IN-38);
    var kopfH = 6 + tz.length*k.stp(13,1.25) + 4;
    var rowsH = (M.lage?3:2)*(k.stp(9.5,1.4)+1.5) + 3 + k.paraH(intro, 9, CW-2*IN, "italic", 1.4) + 4;
    k.fc([238,239,238]); doc.rect(ML, top, CW, kopfH+rowsH, "F");
    k.dc(K.ink); doc.setLineWidth(0.8); doc.line(ML, top+kopfH+rowsH, ML+CW, top+kopfH+rowsH);
    k.ft("helvetica","normal",8.5); k.tc(K.ink3);
    doc.text(cl(T("Entwurf, Stand ","Draft, version ")+M.datum), PW-ML-IN, top+7, {align:"right"});
    k.ft("helvetica","bold",13); k.tc(K.ink);
    tz.forEach(function(l,i){ doc.text(l, ML+IN, top+6+k.base(13)+i*k.stp(13,1.25)); });
    k.setY(top+kopfH);
    k.dc([190,192,190]); doc.setLineWidth(0.2); doc.line(ML+IN, k.getY()-1.5, ML+CW-IN, k.getY()-1.5);
    k.kv(T("Vorhaben","Project"), Z.vorhaben);
    if(M.lage) k.kv(T("Lage","Location"), M.lage);
    k.kv(T("Bewertungsgrundlage","Assessment basis"), T("Biotopwertliste Rheinland-Pfalz","Biotope value list of Rhineland-Palatinate"));
    k.skip(2);
    k.para(intro, 9, K.ink2, ML, CW, "italic", 1.4);
    k.setY(top+kopfH+rowsH+3);

    function block(nr, titel, items){
      k.heading(nr+" "+titel);
      items.forEach(function(it){
        if(it.kv) k.kv(it.kv[0], it.kv[1]);
        else if(it.p){ k.para(it.p, 9.5, K.ink2, ML, CW, "normal", 1.4); k.skip(1.2); }
        else if(it.tab){ k.skip(1); k.tableG(it.tab.head, it.tab.rows, it.tab.w, it.tab.al, 8.2); }
      });
    }
    block("1", T("Ausgangszustand","Initial condition"), Z.s1);
    block("2", T("Ziele","Goals"), Z.s2);
    block("3", T("Geplante Ausgestaltung","Planned design"), Z.s3);
    k.need(48);
    block("4", T("Bewertungsansatz","Assessment approach"), Z.s4);
    if(Z.s5.length) block("5", T("Umsetzung und Sicherung","Implementation and legal securing"), Z.s5);
    k.heading("6 "+T("Unser Anliegen","Our concern"));
    k.para(Z.s6a, 9.5, K.ink2, ML, CW, "normal", 1.4); k.skip(1.5);
    if(Z.s6.length){
      k.para(T("Gemeinsam betrachten möchten wir außerdem:","In addition, we would like to look at the following together:"), 9.5, K.ink2, ML, CW, "normal", 1.4);
      k.skip(0.8);
      k.bullets(Z.s6.map(function(t){ return {t:t}; }));
    }
    k.skip(3);
    k.need(18);
    k.dc(K.line); doc.setLineWidth(0.2); doc.line(ML, k.getY(), ML+CW, k.getY()); k.skip(2);
    k.runs(Z.grundlage, ML, CW, 8.2, K.ink3, 1.45);

    k.seitenfuss(T("Maßnahmenskizze, Entwurf vom ","Measure sketch, draft of ")+M.datum);
    return doc;
  }

  function pdfDownload(was){
    var states = document.querySelectorAll(".pdfstate");
    function say(t){ Array.prototype.forEach.call(states, function(s){ s.textContent = t; }); }
    var doc = null;
    try{ doc = (was==="skizze") ? pdfSkizze() : pdfIntern(); }catch(e){ doc = null; if(window.console) console.error(e); }
    if(!doc){ say(T("Das PDF konnte nicht erstellt werden. Bitte im Browser über Drucken (Strg+P) als PDF speichern.","The PDF could not be created. Please use your browser's print function (Ctrl+P) to save as PDF.")); return; }
    var name = dateiname(was), ab = doc.output("arraybuffer");
    function direkt(){
      try{ doc.save(name); say(T("PDF wird gespeichert. Falls kein Download startet, öffnen Sie die Seite direkt im Browser.","Saving PDF. If no download starts, open the page directly in your browser.")); }
      catch(e){ say(T("Speichern nicht möglich. Bitte im Browser über Drucken (Strg+P) als PDF speichern.","Saving is not possible. Please use your browser's print function (Ctrl+P) to save as PDF.")); }
    }
    if(window.claude && typeof window.claude.use === "function"){
      window.claude.use("downloads").then(function(d){
        if(!d){ direkt(); return; }
        d.save({filename:name, data:ab}).then(
          function(){ say(T("PDF gespeichert.","PDF saved.")); },
          function(err){ say(err && err.code==="declined" ? T("Speichern abgebrochen.","Saving cancelled.") : T("Speichern in dieser Ansicht nicht möglich. Bitte die Seite direkt im Browser öffnen.","Saving is not possible in this view. Please open the page directly in your browser.")); }
        );
      }, direkt);
    } else direkt();
  }

  /* ---------------------------------------------------------------- Rahmen */
  function chrome(){
    document.documentElement.lang = LANG;
    document.title = T("Agroforst Überschlagsrechner","Agroforestry rough-estimate calculator");
    function set(id, html){ var n = document.getElementById(id); if(n) n.innerHTML = html; }
    set("brandline", T("Entscheidungswerkzeug","Decision tool"));
    set("title", T("Agroforst als Kompensationsmaßnahme<span class=\"tsep\">: </span><span class=\"tsub\">Überschlagsrechner</span>","Agroforestry as a compensation measure<span class=\"tsep\">: </span><span class=\"tsub\">rough-estimate calculator</span>"));
    set("standnote", '<a href="#pagefoot" class="tonote">'+HINWEIS_KOPF()+'*</a>');
    set("lede", T("Überschlagen Sie in wenigen Schritten, ob ein Agroforstsystem auf Ihrer Fläche als produktionsintegrierte Kompensationsmaßnahme möglich und sinnvoll ist und wie viele Wertpunkte es einbringen könnte.",
      "Estimate in a few steps whether an agroforestry system on your site is possible and worthwhile as a production-integrated compensation measure, and how many value points it could yield."));
    set("verweise",
      '<details><summary>'+T("So funktioniert es","How it works")+'</summary><div class="vbody">'+
        T("Sie geben ein, was Sie bereits wissen, und können Varianten durchspielen. So bekommen Sie ein Gefühl für die Größenordnungen und sehen früh, worauf es in der Planung ankommt. Ihre Eingaben werden weder gespeichert noch übertragen. Sie können zwischen den Schritten wechseln, solange das Fenster geöffnet bleibt. Im letzten Schritt laden Sie Ihre Ergebnisse herunter.",
          "You enter what you already know and can play through variants. This gives you a feel for the orders of magnitude and shows early on what matters in planning. Your entries are neither stored nor transmitted. You can switch between the steps as long as the window stays open. In the last step you download your results.")+'</div></details>'+
      '<details><summary>'+T("Rechengrundlage","Calculation basis")+'</summary><div class="vbody">'+
        T("<b>Rechengrundlage: Biotopwertliste Rheinland-Pfalz</b>, Punkteskala 0 bis 24, in Aufbau und Skala der Bundeskompensationsverordnung ähnlich. Aus anderen Bundesländern lässt sich das Werkzeug zur Orientierung nutzen; die Punkte sind nicht übertragbar.",
          "<b>Calculation basis: biotope value list of Rhineland-Palatinate</b>, point scale 0 to 24, similar in structure and scale to the Federal Compensation Ordinance. The tool can be used for orientation in other federal states; the points are not transferable.")+
        '<div class="vnote"><a class="tonote" href="#pagefoot">'+HINWEIS_KOPF()+'*</a></div></div></details>');
    document.getElementById("rail").setAttribute("aria-label", T("Schritte","Steps"));
    document.getElementById("pagefoot").innerHTML = fussHTML();
    ["de","en"].forEach(function(l){
      var b = document.getElementById("lang-"+l);
      if(b) b.setAttribute("aria-pressed", String(l===LANG));
    });
  }

  function render(){
    document.getElementById("progress").style.width = Math.round((step/5)*100) + "%";
    document.querySelector(".wrap").classList.toggle("compact", step>0);

    var rail = document.getElementById("rail");
    rail.innerHTML = "";
    steps().forEach(function(name,i){
      var offen = (i<4 && i<=maxReached) ? hinweise(i).length : 0;
      var b = el("button",{class:"railitem", type:"button", "data-seen":(i<=maxReached?"1":"0"),
        "aria-current":(i===step?"true":"false")},
        '<span class="b">'+(i===5?"✓":(i+1))+'</span><span class="t">'+name+'</span>'+(offen?'<span class="dot"></span>':''));
      b.addEventListener("click", function(){ go(i); });
      rail.appendChild(b);
    });

    var main = document.getElementById("main");
    main.innerHTML = (step===5) ? sheetHTML() : '<section class="panel">'+panelHTML(step)+'</section>';

    var nav = el("div",{class:"nav no-print"});
    if(step>0){
      var back = el("button",{class:"btn ghost",type:"button"},T("Zurück","Back"));
      back.addEventListener("click", function(){ go(step-1); });
      nav.appendChild(back);
    }
    if(step<5){
      var next = el("button",{class:"btn",type:"button"}, step===4 ? T("Ergebnisblatt","Result sheet") : T("Weiter","Next"));
      next.addEventListener("click", function(){
        if(fehlend(step).length){
          pruefen = true; markUpdate(); navState();
          var first = document.querySelector("#main .miss");
          if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
          return;
        }
        go(step+1);
      });
      nav.appendChild(next);
      nav.appendChild(el("span",{class:"spacer"}));
      nav.appendChild(el("span",{class:"counter", id:"fehlt"}, ""));
    } else {
      var again = el("button",{class:"btn ghost",type:"button"},T("Neu beginnen","Start over"));
      again.addEventListener("click", function(){ S = leer(); maxReached = 0; go(0); });
      nav.appendChild(again);
    }
    main.appendChild(nav);
    bind();
    markUpdate(); navState();
  }

  function go(i){
    step = i; pruefen = false; maxReached = Math.max(maxReached, i); render();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function navState(){
    markUpdate();
    var f = document.getElementById("fehlt");
    if(f) f.textContent = (pruefen && !fertig(step)) ? T("Bitte die markierten Angaben ergänzen","Please complete the marked entries") : "";
  }

  function refresh(){
    var active = document.activeElement, id = active ? active.id : null;
    var pos = null;
    try{ if(active && active.selectionStart!==undefined) pos = active.selectionStart; }catch(e){}
    var sec = document.querySelector("#main .panel");
    if(!sec){ render(); return; }
    sec.innerHTML = panelHTML(step);
    navState();
    document.getElementById("progress").style.width = Math.round((step/5)*100) + "%";
    bind();
    if(id){
      var again = document.getElementById(id);
      if(again){ again.focus(); try{ if(pos!==null) again.setSelectionRange(pos,pos); }catch(e){} }
    }
  }

  function nurRechnung(){
    var box = document.getElementById("calcOut");
    if(!box){ refresh(); return; }
    box.innerHTML = calcOutHTML();
    navState();
  }

  function setLang(l){
    if(l===LANG) return;
    LANG = l; setFormats(); chrome(); render();
    try{ history.replaceState(null,"",(location.pathname||"")+(l==="en"?"?lang=en":"")); }catch(e){}
  }

  function bind(){
    var main = document.getElementById("main");

    main.querySelectorAll('input[type=radio]').forEach(function(r){
      r.addEventListener("change", function(){
        S[r.name] = r.value;
        if(r.name==="a2") S.timeLag = null;
        if(r.name==="nutzung"){ var rw = richtwert(); S.wertManuell = rw===null ? "" : String(rw); }
        refresh();
      });
    });
    main.querySelectorAll('input[name=ziele]').forEach(function(c){
      c.addEventListener("change", function(){
        var i = S.ziele.indexOf(c.value);
        if(c.checked && i<0) S.ziele.push(c.value);
        if(!c.checked && i>=0) S.ziele.splice(i,1);
        refresh();
      });
    });
    main.querySelectorAll('input[name=achsen]').forEach(function(c){
      c.addEventListener("change", function(){ S[c.value] = c.checked; refresh(); });
    });

    ["laenge","breite","schlag","anzahl"].forEach(function(id){
      var n = document.getElementById(id);
      if(!n) return;
      n.addEventListener("input", function(){
        S[id] = n.value;
        if(id==="breite"){
          var erlaubt = SAUM_OPT.slice().reverse().filter(function(b){ return b>0 && 2*b < zahl(S.breite); });
          if(zahl(S.saum) > 0 && erlaubt.indexOf(zahl(S.saum)) < 0) S.saum = erlaubt.length ? erlaubt[0] : 0;
          var sel = document.getElementById("saum");
          if(sel){
            Array.prototype.forEach.call(sel.options, function(op){
              var b = zahl(op.value);
              op.disabled = (b>0 && 2*b >= zahl(S.breite));
            });
            sel.value = String(S.saum);
          }
        }
        nurRechnung();
      });
    });
    var wm = document.getElementById("wertManuell");
    if(wm) wm.addEventListener("input", function(){ S.wertManuell = wm.value; navState(); });
    var sa = document.getElementById("saum");
    if(sa) sa.addEventListener("change", function(){ S.saum = zahl(sa.value); nurRechnung(); });
    var tl = document.getElementById("timeLag");
    if(tl) tl.addEventListener("change", function(){ S.timeLag = zahl(tl.value); nurRechnung(); });

    var g = document.getElementById("gemeinde");
    if(g) g.addEventListener("input", function(){ S.gemeinde = g.value; });
    var lg = document.getElementById("lage");
    if(lg) lg.addEventListener("input", function(){ S.lage = lg.value; });
    var nz = document.getElementById("notiz");
    if(nz) nz.addEventListener("input", function(){ S.notiz = nz.value; });

    main.querySelectorAll(".pdfbtn").forEach(function(b){ b.addEventListener("click", function(){ pdfDownload(b.getAttribute("data-doc")); }); });
    main.querySelectorAll("button.jump").forEach(function(b){
      b.addEventListener("click", function(){ go(zahl(b.getAttribute("data-go"))); });
    });

    var cp = document.getElementById("copyMail");
    if(cp) cp.addEventListener("click", function(){
      var txt = mailText(), state = document.getElementById("copyState");
      function ok(){ if(state) state.textContent = T("Kopiert.","Copied."); }
      function fallback(){
        var box = document.getElementById("mailText");
        try{
          var r = document.createRange(); r.selectNodeContents(box);
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
          if(state) state.textContent = T("Text ist markiert, bitte mit Strg+C kopieren.","Text is selected, please copy with Ctrl+C.");
        }catch(e){ if(state) state.textContent = T("Bitte den Text von Hand markieren und kopieren.","Please select and copy the text manually."); }
      }
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(ok, fallback);
        } else fallback();
      }catch(e){ fallback(); }
    });
  }

  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest("a.tonote");
    if(!a) return;
    e.preventDefault();
    var t = document.getElementById("pagefoot");
    if(t) t.scrollIntoView({behavior:"smooth", block:"start"});
  });
  document.addEventListener("toggle", function(e){
    var d = e.target;
    if(d && d.tagName==="DETAILS" && d.open) document.querySelectorAll("#verweise details").forEach(function(o){ if(o!==d) o.open = false; });
  }, true);
  document.getElementById("lang-de").addEventListener("click", function(){ setLang("de"); });
  document.getElementById("lang-en").addEventListener("click", function(){ setLang("en"); });
  chrome();
  render();
})();

</script>
