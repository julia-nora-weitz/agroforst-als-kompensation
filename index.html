  function dateiname(){
    var d = new Date();
    function p(n){ return (n<10?"0":"")+n; }
    var n = String(d.getFullYear()).slice(2)+" "+p(d.getMonth()+1)+" "+p(d.getDate())+" "+T("Vorprüfung Agroforst","Agroforestry pre-check");
    if(S.gemeinde.trim()) n += " " + S.gemeinde.trim().replace(/[\\\/:*?"<>|]+/g," ").replace(/\s+/g," ").slice(0,60);
    return n + ".pdf";
  }

  function pdfBauen(){
    var J = window.jspdf && window.jspdf.jsPDF;
    if(!J) return null;
    var M = buildModel(), c = M.c;
    var doc = new J({unit:"mm", format:"a4", orientation:"portrait", compress:true});
    var PW=210, PH=297, ML=18, MT=18, MB=22, CW=174, PT=0.3528, y=MT;
    var K = {ink:[25,33,28], ink2:[71,84,76], ink3:[120,132,124], line:[221,227,222], acc:[31,122,82], accBg:[232,244,237],
             warn:[158,59,44], warnBg:[251,238,235], tint:[242,246,243]};
    function cl(s){ return String(s).replace(/[  ]/g," ").replace(/−/g,"-").replace(/m²/g,"m2").replace(/[“”]/g,'"').replace(/·/g,"-"); }
    function tc(a){ doc.setTextColor(a[0],a[1],a[2]); }
    function fc(a){ doc.setFillColor(a[0],a[1],a[2]); }
    function dc(a){ doc.setDrawColor(a[0],a[1],a[2]); }
    function ft(face,style,size){ doc.setFont(face,style); doc.setFontSize(size); }
    function stp(size,k){ return size*PT*(k||1.4); }
    function need(h){ if(y+h > PH-MB){ doc.addPage(); y = MT; } }
    function base(size){ return size*PT*0.85; }

    function para(t,size,colr,x,w,style,k){
      ft("helvetica",style||"normal",size);
      var ls = doc.splitTextToSize(cl(t), w), st = stp(size,k);
      ls.forEach(function(l){
        need(st); ft("helvetica",style||"normal",size); tc(colr);
        doc.text(l, x, y+base(size)); y += st;
      });
    }
    function runs(rs,x,w,size,colr,k){
      var st = stp(size,k), toks = [], sp = false;
      rs.forEach(function(r){
        cl(r.t).split(" ").forEach(function(p,j){
          if(p===""){ sp = true; return; }
          toks.push({t:p, r:r, sp: sp || j>0});
          sp = false;
        });
      });
      function sty(r){ return r.b ? (r.i?"bolditalic":"bold") : (r.i?"italic":"normal"); }
      var lines = [[]], cx = 0;
      toks.forEach(function(t){
        ft("helvetica", sty(t.r), size);
        var tw = doc.getTextWidth(t.t), spw = doc.getTextWidth(" ");
        var add = (cx>0 && t.sp) ? spw : 0;
        if(cx>0 && cx+add+tw > w){ lines.push([]); cx = 0; add = 0; }
        lines[lines.length-1].push({t:t.t, r:t.r, x:cx+add, w:tw});
        cx += add+tw;
      });
      lines.forEach(function(ln){
        need(st);
        ln.forEach(function(wd){
          ft("helvetica", sty(wd.r), size);
          tc(wd.r.u ? K.acc : colr);
          var b = y+base(size);
          doc.text(wd.t, x+wd.x, b);
          if(wd.r.u){
            dc(K.acc); doc.setLineWidth(0.15);
            doc.line(x+wd.x, b+0.5, x+wd.x+wd.w, b+0.5);
            doc.link(x+wd.x, y, wd.w, st, {url:wd.r.u});
          }
        });
        y += st;
      });
    }
    function heading(t){
      need(24); y += 5;
      ft("times","normal",13); tc(K.ink); doc.text(cl(t), ML, y+4.2);
      y += 6.4; dc(K.line); doc.setLineWidth(0.2); doc.line(ML, y, ML+CW, y); y += 2.6;
    }
    function kv(l,t,bold){
      var size = 9, st = stp(size,1.4);
      ft("helvetica",bold?"bold":"normal",size);
      var ls = doc.splitTextToSize(cl(t), CW-47);
      need(ls.length*st+1.5);
      ft("helvetica",bold?"bold":"normal",8); tc(bold?K.acc:K.ink3); doc.text(cl(l), ML, y+base(size));
      ft("helvetica",bold?"bold":"normal",size); tc(bold?K.ink:K.ink2);
      ls.forEach(function(s,i){ doc.text(s, ML+47, y+base(size)+i*st); });
      y += ls.length*st+1.5;
    }
    function bullets(items){
      items.forEach(function(it){
        need(stp(9,1.4)*2);
        fc(K.acc); doc.circle(ML+1.1, y+2.0, 0.55, "F");
        var rs = it.b ? [{t:it.b+" ", b:true},{t:it.t}] : [{t:it.t}];
        runs(rs, ML+5, CW-5, 9, K.ink2, 1.4);
        y += 1.3;
      });
    }
    function chip(t,kind){
      ft("helvetica","bold",8.5);
      var tw = doc.getTextWidth(cl(t))+7, h = 6.4;
      need(h+3);
      var fcol = kind==="warn" ? K.warnBg : K.accBg, ccol = kind==="warn" ? K.warn : K.acc;
      fc(fcol); dc(ccol); doc.setLineWidth(0.25); doc.roundedRect(ML, y, tw, h, 3.2, 3.2, "FD");
      tc(ccol); doc.text(cl(t), ML+3.5, y+4.3); y += h+3;
    }
    function kpis(list){
      var gap = 3, w = (CW-2*gap)/3, h = 25;
      need(h+3);
      list.forEach(function(k,i){
        var x = ML+i*(w+gap);
        fc(K.tint); dc(K.line); doc.setLineWidth(0.25); doc.roundedRect(x, y, w, h, 1.5, 1.5, "FD");
        ft("helvetica","bold",6.5); tc(K.ink3); doc.text(cl(k.k).toUpperCase(), x+3.5, y+5);
        ft("times","normal",17); tc(K.ink); doc.text(cl(k.v), x+3.5, y+13.5);
        ft("helvetica","normal",7.2); tc(K.ink3);
        doc.splitTextToSize(cl(k.s), w-7).slice(0,3).forEach(function(l,j){ doc.text(l, x+3.5, y+18.2+j*3.1); });
      });
      y += h+3;
    }
    function table(head, rows, sum, widths){
      function cell(row, size, style, colr, lineTop){
        var ls = row.map(function(t,i){ ft("helvetica",style,size); return doc.splitTextToSize(cl(t), widths[i]-2.5); });
        var n = Math.max.apply(null, ls.map(function(a){ return a.length; }));
        var h = n*stp(size,1.3)+2.6;
        need(h);
        if(lineTop){ dc(K.ink); doc.setLineWidth(0.3); doc.line(ML, y, ML+CW, y); }
        var x = ML;
        ls.forEach(function(a,i){
          ft("helvetica",style,size); tc(colr);
          a.forEach(function(l,k){
            var ty = y+1.3+base(size)+k*stp(size,1.3);
            if(i===0) doc.text(l, x, ty); else doc.text(l, x+widths[i]-1.2, ty, {align:"right"});
          });
          x += widths[i];
        });
        y += h;
        if(!lineTop){ dc(K.line); doc.setLineWidth(0.2); doc.line(ML, y, ML+CW, y); }
      }
      need(30);
      cell(head.map(function(t){ return cl(t).toUpperCase(); }), 6.8, "bold", K.ink3, false);
      rows.forEach(function(r){ cell(r, 8.8, "normal", K.ink2, false); });
      cell(sum, 9, "bold", K.ink, true);
      y += 2;
    }

    ft("helvetica","bold",7.5); tc(K.acc);
    doc.text(T("ERGEBNISBLATT DER VORPRÜFUNG","RESULT SHEET OF THE PRE-CHECK"), ML, y+2.2);
    ft("helvetica","normal",8); tc(K.ink3);
    [T("Rheinland-Pfalz","Rhineland-Palatinate"),T("Stand Oktober 2026","Version October 2026"),T("Erstellt am ","Created on ")+M.datum].forEach(function(t,i){
      doc.text(t, PW-ML, y+2.2+i*3.8, {align:"right"});
    });
    y += 8;
    ft("times","normal",20); tc(K.ink);
    doc.splitTextToSize(cl(M.gem), CW-45).forEach(function(l){ doc.text(l, ML, y+base(20)); y += stp(20,1.2); });
    ft("helvetica","normal",9); tc(K.ink3);
    doc.text(T("Agroforst als Kompensation, Vorprüfung für Kommunen","Agroforestry as compensation: pre-check for municipalities"), ML, y+base(9)); y += 6;
    chip(M.chip.t, M.chip.k);
    M.warns.forEach(function(x){
      para(T("Achtung, ","Warning, ")+schrittName(x.schritt)+": "+x.kurz, 9, K.warn, ML, CW, "normal", 1.4);
    });
    y += 2;
    kpis(M.kpis);
    if(M.low) para(M.low, 8.5, K.ink3, ML, CW, "normal", 1.4);

    heading(T("Angenommene Konstellation","Assumed constellation"));
    para(T("Angaben aus dem Durchlauf. Sie sind Annahmen des Überschlags, keine Zusagen.","Entries from the run-through. They are assumptions of the rough estimate, not commitments."), 8.5, K.ink3, ML, CW, "normal", 1.4);
    y += 1.5;
    M.konst.forEach(function(r){ kv(r[0], r[1], r[2]); });

    heading(T("Rechnerischer Überschlag","Calculated estimate"));
    M.herl.forEach(function(r){ kv(r[0], r[1]); });
    y += 2;
    table(M.tabKopf, M.tab, M.tabSumme, [40,26,28,26,28,26]);
    para(T("Werte gerundet. Die Wertpunkte ergeben sich aus Fläche mal Aufwertung je m².","Values rounded. The value points result from area times uplift per m²."), 7.8, K.ink3, ML, CW, "normal", 1.4);
    y += 2;
    M.geld.forEach(function(r){ kv(r[0], r[1]); });

    heading(T("Was im Pflanzplan festgeschrieben werden muss","What must be fixed in the planting plan"));
    bullets(M.auflagen.map(function(a){ return {t:a}; }));

    heading(T("Zu klären in der Vorbesprechung","To be clarified in the preliminary discussion"));
    bullets(M.klaeren);

    if(M.notiz.length){
      heading(T("Anmerkungen der Kommune","Notes from the municipality"));
      bullets(M.notiz.map(function(z){ return {t:z}; }));
    }

    need(46); y += 6;
    dc(K.ink); doc.setLineWidth(0.3); doc.line(ML, y, ML+CW, y); y += 3.2;
    fuss().forEach(function(p){ runs(p, ML, CW, 7.4, K.ink3, 1.45); y += 1.6; });

    var n = doc.getNumberOfPages();
    for(var i=1;i<=n;i++){
      doc.setPage(i);
      dc(K.line); doc.setLineWidth(0.2); doc.line(ML, PH-14, ML+CW, PH-14);
      ft("helvetica","normal",7.5); tc(K.ink3);
      doc.text(cl(T("Vorprüfung Agroforst als Kompensation, ","Agroforestry as compensation: pre-check, ")+M.gem+T(", Stand Oktober 2026",", version October 2026")), ML, PH-10.5);
      doc.text(T("Seite ","Page ")+i+T(" von "," of ")+n, PW-ML, PH-10.5, {align:"right"});
    }
    return doc;
  }

  function pdfDownload(){
    var states = document.querySelectorAll(".pdfstate");
    function say(t){ Array.prototype.forEach.call(states, function(s){ s.textContent = t; }); }
    var doc = null;
    try{ doc = pdfBauen(); }catch(e){ doc = null; }
    if(!doc){ say(T("Das PDF konnte nicht erstellt werden. Bitte im Browser über Drucken (Strg+P) als PDF speichern.","The PDF could not be created. Please use your browser's print function (Ctrl+P) to save as PDF.")); return; }
    var name = dateiname(), ab = doc.output("arraybuffer");
    function direkt(){
      try{ doc.save(name); say(T("PDF wird gespeichert. Falls kein Download startet, öffnen Sie die Seite direkt im Browser.","Saving PDF. If no download starts, open the page directly in your browser.")); }
      catch(e){ say(T("Speichern nicht möglich. Bitte im Browser über Drucken (Strg+P) als PDF speichern.","Saving is not possible. Please use your browser's print function (Ctrl+P) to save as PDF.")); }
    }
    if(window.claude && typeof window.claude.use === "function"){
      window.claude.use("downloads").then(function(d){
        if(!d){ direkt(); return; }
        d.save({filename:name, data:ab}).then(
          function(){ say(T("PDF gespeichert.","PDF saved.")); },
          function(err){ say(err && err.code==="declined" ? T("Speichern abgebrochen.","Saving cancelled.") : T("Speichern in dieser Ansicht nicht möglich. Bitte die Seite direkt im Browser öffnen.","Saving is not possible in this view. Please open the page directly in your browser.")); }
        );
      }, direkt);
    } else direkt();
  }

  /* ---------------------------------------------------------------- Rahmen */
  function chrome(){
    document.documentElement.lang = LANG;
    document.title = T("Agroforst Überschlagsrechner","Agroforestry rough-estimate calculator");
    function set(id, html){ var n = document.getElementById(id); if(n) n.innerHTML = html; }
    set("brandline", T("Entscheidungswerkzeug","Decision tool"));
    set("title", T("Agroforst als Kompensationsmaßnahme<span class=\"tsep\">: </span><span class=\"tsub\">Überschlagsrechner</span>","Agroforestry as a compensation measure<span class=\"tsep\">: </span><span class=\"tsub\">rough-estimate calculator</span>"));
    set("standnote", '<a href="#pagefoot" class="tonote">'+HINWEIS_KOPF()+'*</a>');
    set("lede", T("Überschlagen Sie in wenigen Schritten, ob ein Agroforstsystem auf Ihrer Fläche als produktionsintegrierte Kompensationsmaßnahme möglich und sinnvoll ist und wie viele Wertpunkte es einbringen könnte.",
      "Estimate in a few steps whether an agroforestry system on your site is possible and worthwhile as a production-integrated compensation measure, and how many value points it could yield."));
    set("verweise",
      '<details><summary>'+T("So funktioniert es","How it works")+'</summary><div class="vbody">'+
        T("Sie geben ein, was Sie bereits wissen, und können Varianten durchspielen. So bekommen Sie ein Gefühl für die Größenordnungen und sehen früh, worauf es in der Planung ankommt. Ihre Eingaben werden weder gespeichert noch übertragen. Sie können zwischen den Schritten wechseln, solange das Fenster geöffnet bleibt. Im letzten Schritt laden Sie Ihre Ergebnisse herunter.",
          "You enter what you already know and can play through variants. This gives you a feel for the orders of magnitude and shows early on what matters in planning. Your entries are neither stored nor transmitted. You can switch between the steps as long as the window stays open. In the last step you download your results.")+'</div></details>'+
      '<details><summary>'+T("Rechengrundlage","Calculation basis")+'</summary><div class="vbody">'+
        T("<b>Rechengrundlage: Biotopwertliste Rheinland-Pfalz</b>, Punkteskala 0 bis 24, in Aufbau und Skala der Bundeskompensationsverordnung ähnlich. Aus anderen Bundesländern lässt sich das Werkzeug zur Orientierung nutzen; die Punkte sind nicht übertragbar.",
          "<b>Calculation basis: biotope value list of Rhineland-Palatinate</b>, point scale 0 to 24, similar in structure and scale to the Federal Compensation Ordinance. The tool can be used for orientation in other federal states; the points are not transferable.")+'</div></details>'+
      '<a class="vlink tonote" href="#pagefoot">'+HINWEIS_KOPF()+'*</a>');
    document.getElementById("rail").setAttribute("aria-label", T("Schritte","Steps"));
    document.getElementById("pagefoot").innerHTML = fussHTML();
    ["de","en"].forEach(function(l){
      var b = document.getElementById("lang-"+l);
      if(b) b.setAttribute("aria-pressed", String(l===LANG));
    });
  }

  function render(){
    document.getElementById("progress").style.width = Math.round((step/5)*100) + "%";
    document.getElementById("pagefoot").hidden = (step===5);
    document.querySelector(".wrap").classList.toggle("compact", step>0);

    var rail = document.getElementById("rail");
    rail.innerHTML = "";
    steps().forEach(function(name,i){
      var offen = (i<4 && i<=maxReached) ? hinweise(i).length : 0;
      var b = el("button",{class:"railitem", type:"button", "data-seen":(i<=maxReached?"1":"0"),
        "aria-current":(i===step?"true":"false")},
        '<span class="b">'+(i===5?"✓":(i+1))+'</span><span class="t">'+name+'</span>'+(offen?'<span class="dot"></span>':''));
      b.addEventListener("click", function(){ go(i); });
      rail.appendChild(b);
    });

    var main = document.getElementById("main");
    main.innerHTML = (step===5) ? sheetHTML() : '<section class="panel">'+panelHTML(step)+'</section>';

    var nav = el("div",{class:"nav no-print"});
    if(step>0){
      var back = el("button",{class:"btn ghost",type:"button"},T("Zurück","Back"));
      back.addEventListener("click", function(){ go(step-1); });
      nav.appendChild(back);
    }
    if(step<5){
      var next = el("button",{class:"btn",type:"button"}, step===4 ? T("Ergebnisblatt","Result sheet") : T("Weiter","Next"));
      next.addEventListener("click", function(){
        if(fehlend(step).length){
          pruefen = true; markUpdate(); navState();
          var first = document.querySelector("#main .miss");
          if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
          return;
        }
        go(step+1);
      });
      nav.appendChild(next);
      nav.appendChild(el("span",{class:"spacer"}));
      nav.appendChild(el("span",{class:"counter", id:"fehlt"}, ""));
    } else {
      var dl = el("button",{class:"btn pdfbtn",type:"button"},T("Ergebnisblatt als PDF herunterladen","Download result sheet as PDF"));
      nav.appendChild(dl);
      var again = el("button",{class:"btn ghost",type:"button"},T("Neu beginnen","Start over"));
      again.addEventListener("click", function(){ S = leer(); maxReached = 0; go(0); });
      nav.appendChild(again);
      nav.appendChild(el("span",{class:"counter pdfstate"},""));
    }
    main.appendChild(nav);
    bind();
    markUpdate(); navState();
  }

  function go(i){
    step = i; pruefen = false; maxReached = Math.max(maxReached, i); render();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function navState(){
    markUpdate();
    var f = document.getElementById("fehlt");
    if(f) f.textContent = (pruefen && !fertig(step)) ? T("Bitte die markierten Angaben ergänzen","Please complete the marked entries") : "";
  }

  function refresh(){
    var active = document.activeElement, id = active ? active.id : null;
    var pos = null;
    try{ if(active && active.selectionStart!==undefined) pos = active.selectionStart; }catch(e){}
    var sec = document.querySelector("#main .panel");
    if(!sec){ render(); return; }
    sec.innerHTML = panelHTML(step);
    navState();
    document.getElementById("progress").style.width = Math.round((step/5)*100) + "%";
    bind();
    if(id){
      var again = document.getElementById(id);
      if(again){ again.focus(); try{ if(pos!==null) again.setSelectionRange(pos,pos); }catch(e){} }
    }
  }

  function nurRechnung(){
    var box = document.getElementById("calcOut");
    if(!box){ refresh(); return; }
    box.innerHTML = calcOutHTML();
    navState();
  }

  function setLang(l){
    if(l===LANG) return;
    LANG = l; setFormats(); chrome(); render();
    try{ history.replaceState(null,"",(location.pathname||"")+(l==="en"?"?lang=en":"")); }catch(e){}
  }

  function bind(){
    var main = document.getElementById("main");

    main.querySelectorAll('input[type=radio]').forEach(function(r){
      r.addEventListener("change", function(){
        S[r.name] = r.value;
        if(r.name==="a2") S.timeLag = null;
        if(r.name==="nutzung"){ var rw = richtwert(); S.wertManuell = rw===null ? "" : String(rw); }
        refresh();
      });
    });
    main.querySelectorAll('input[name=ziele]').forEach(function(c){
      c.addEventListener("change", function(){
        var i = S.ziele.indexOf(c.value);
        if(c.checked && i<0) S.ziele.push(c.value);
        if(!c.checked && i>=0) S.ziele.splice(i,1);
        refresh();
      });
    });
    main.querySelectorAll('input[name=achsen]').forEach(function(c){
      c.addEventListener("change", function(){ S[c.value] = c.checked; refresh(); });
    });

    ["laenge","breite","schlag","anzahl"].forEach(function(id){
      var n = document.getElementById(id);
      if(!n) return;
      n.addEventListener("input", function(){
        S[id] = n.value;
        if(id==="breite"){
          var erlaubt = SAUM_OPT.slice().reverse().filter(function(b){ return b>0 && 2*b < zahl(S.breite); });
          if(zahl(S.saum) > 0 && erlaubt.indexOf(zahl(S.saum)) < 0) S.saum = erlaubt.length ? erlaubt[0] : 0;
          var sel = document.getElementById("saum");
          if(sel){
            Array.prototype.forEach.call(sel.options, function(op){
              var b = zahl(op.value);
              op.disabled = (b>0 && 2*b >= zahl(S.breite));
            });
            sel.value = String(S.saum);
          }
        }
        nurRechnung();
      });
    });
    var wm = document.getElementById("wertManuell");
    if(wm) wm.addEventListener("input", function(){ S.wertManuell = wm.value; navState(); });
    var sa = document.getElementById("saum");
    if(sa) sa.addEventListener("change", function(){ S.saum = zahl(sa.value); nurRechnung(); });
    var tl = document.getElementById("timeLag");
    if(tl) tl.addEventListener("change", function(){ S.timeLag = zahl(tl.value); nurRechnung(); });

    var g = document.getElementById("gemeinde");
    if(g) g.addEventListener("input", function(){ S.gemeinde = g.value; });
    var lg = document.getElementById("lage");
    if(lg) lg.addEventListener("input", function(){ S.lage = lg.value; });
    var nz = document.getElementById("notiz");
    if(nz) nz.addEventListener("input", function(){ S.notiz = nz.value; });

    main.querySelectorAll(".pdfbtn").forEach(function(b){ b.addEventListener("click", pdfDownload); });
    main.querySelectorAll("button.jump").forEach(function(b){
      b.addEventListener("click", function(){ go(zahl(b.getAttribute("data-go"))); });
    });

    var cp = document.getElementById("copyMail");
    if(cp) cp.addEventListener("click", function(){
      var txt = mailText(), state = document.getElementById("copyState");
      function ok(){ if(state) state.textContent = T("Kopiert.","Copied."); }
      function fallback(){
        var box = document.getElementById("mailText");
        try{
          var r = document.createRange(); r.selectNodeContents(box);
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
          if(state) state.textContent = T("Text ist markiert, bitte mit Strg+C kopieren.","Text is selected, please copy with Ctrl+C.");
        }catch(e){ if(state) state.textContent = T("Bitte den Text von Hand markieren und kopieren.","Please select and copy the text manually."); }
      }
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(ok, fallback);
        } else fallback();
      }catch(e){ fallback(); }
    });
  }

  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest("a.tonote");
    if(!a) return;
    e.preventDefault();
    var t = step===5 ? document.querySelector(".sheetfoot") : document.getElementById("pagefoot");
    if(t) t.scrollIntoView({behavior:"smooth", block:"start"});
  });
  document.addEventListener("toggle", function(e){
    var d = e.target;
    if(d && d.tagName==="DETAILS" && d.open) document.querySelectorAll("#verweise details").forEach(function(o){ if(o!==d) o.open = false; });
  }, true);
  document.getElementById("lang-de").addEventListener("click", function(){ setLang("de"); });
  document.getElementById("lang-en").addEventListener("click", function(){ setLang("en"); });
  chrome();
  render();
})();

</script>
